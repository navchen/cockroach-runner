    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--gna-bg); color: var(--gna-ink); font-family: var(--gna-font); padding: 24px; }
    main { max-width: 560px; text-align: center; }

    h1 em { color: #64834d; }
    html.gna-dark h1 em { color: #a9cf94; }
    p { color: var(--gna-muted); line-height: 1.6; margin: 0 0 32px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .row a, .row button { display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 10px; font: 600 14px/1 var(--gna-font); text-decoration: none; cursor: pointer; border: 1px solid var(--gna-line); background: var(--gna-surface); color: var(--gna-ink); }
    .row a.primary { background: var(--gna-brand); border-color: var(--gna-brand); color: var(--gna-bg); }
    .mods { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .mods a { font-size: 13px; color: var(--gna-muted); text-decoration: none; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--gna-line); }
    .mods a:hover { color: var(--gna-ink); }
