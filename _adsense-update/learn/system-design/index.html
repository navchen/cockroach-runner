ustain. Count resources, operations, and engineering effort, not just server count.", "analogy": "A shop’s expenses include rent, staffing, supplies, and delivery. A cheap counter can still be expensive if it creates lots of manual work.", "steps": ["Name the largest cost drivers.", "Compare options under the same workload and quality targets.", "Measure before and after an optimization."], "sections": [["Account for the whole path", "Compute, retained storage, replicas, backups, network transfer, requests to services, and monitoring all contribute. A media product may pay mostly for bytes moved; a write-heavy workflow may pay for storage operations and replicas. Pricing depends on the actual provider and date, so this course uses no live price assumptions."], ["Design for the load shape", "Average traffic can hide a short expensive peak. Keep enough capacity for the response target and the intended failure scenario. Autoscaling can help variable demand, but its startup time and shared bottlenecks still matter."], ["People are part of the system", "Operating a complex self-managed cluster can consume engineering time. A managed service may cost more per resource but remove some maintenance tasks. Compare required guarantees, limits, migration cost, and team capacity instead of assuming either is universally cheaper."]], "example": "If repeated image downloads dominate traffic, improve object sizing and safe edge caching before optimizing a tiny metadata lookup. Measure byte egress and cache behavior.", "tradeoff": "Cost reductions that remove safety headroom or required durability may violate the product’s contract. Compare like-for-like behavior.", "prompt": "List four likely costs for file sharing and pick the first measurement you would collect.", "answer": "Object storage, download transfer, request operations, and backups/version retention. Start with bytes downloaded and retained over a defined period, then inspect which pattern dominates.", "terms": [["Capacity headroom", "Resources reserved beyond current demand."], ["Egress", "Data transferred out of a system or service boundary."], ["Operational cost", "The effort and resources needed to run the product."]], "quiz": [{"q": "The lowest server count always means the lowest total cost.", "opts": ["True", "False; transfer, storage, and operations also count"], "a": 1, "why": "System cost includes the whole path."}, {"q": "A fair cost comparison keeps…", "opts": ["Workload and quality requirements comparable", "Only the tool names the same", "No failure assumptions"], "a": 0, "why": "A cheaper system that misses requirements is not equivalent."}], "minutes": 20, "lab": null, "stage": 4, "group": "05 · Operate reliably"}, {"title": "Clarify before you design", "group": "06 · Practice professional decisions", "minutes": 30, "goal": "Turn an ambiguous prompt into a measurable contract.", "sections": [["Start with the user", "A system design interview is a conversation about decisions under constraints. Before drawing anything, name the users and the two or three journeys they need. For a URL shortener: create a link, redirect a visitor, and optionally expire a link. Ask whether analytics, custom aliases, and abuse detection are in scope. State your assumptions aloud when answers are unavailable."], ["Separate behavior from quality", "Functional requirements describe behavior. Nonfunctional requirements describe scale and quality: daily active users, peak requests per second, retention, p99 latency, availability, and correctness. A target such as “fast” is hard to defend. A target such as “redirects complete within 150 ms at p99 in one region” lets you discuss a latency budget. Clarify whether network time is included."], ["Use a 45-minute structure", "Spend roughly 5 minutes clarifying, 5 estimating and defining APIs, 10 building a baseline, 15 exploring the most important bottleneck, 7 handling failures, and 3 summarizing. These are practice allocations, not rigid interview rules. Confirm the interviewer’s interest before a deep dive. Prefer a simple working path before adding components."], ["What a good answer sounds like", "Explain each box by its responsibility and each arrow by its data. Say why the chosen design meets one requirement, what it costs, and when you would change it. An architecture with fewer justified components is stronger than a catalog of product names. Treat the interviewer as a collaborator: invite a choice between two useful deep dives."]], "example": "“I’ll focus on link creation and redirects. Can links expire? I’ll assume 10 million daily readers, 20 redirects each, and a 10× peak-to-average ratio. Redirect availability matters more than immediate analytics.”", "tradeoff": "Adding features expands both data and failure modes. Scope buys time for depth; explicitly record excluded features instead of silently ignoring them.", "prompt": "Write a requirements contract for a photo-sharing app: 3 functional requirements, 3 measurable quality targets, and 2 exclusions.", "answer": "Possible contract: upload, view a feed, and follow users. Assume 5M DAU, 99.9% monthly availability for feed reads, p99 metadata response below 300 ms. Exclude live video and private messaging. These are assumptions to validate, not universal targets.", "quiz": [{"q": "Which clarification most directly changes a chat architecture?", "opts": ["Preferred logo color", "Whether messages must work offline and across devices", "Which programming language you like"], "a": 1, "why": "Offline delivery and multiple devices require durable messages, synchronization, and delivery state."}, {"q": "The interviewer gives no traffic numbers. What should you do?", "opts": ["Stop until a number is given", "Use an explicit, reasonable assumption and check it", "Immediately choose microservices"], "a": 1, "why": "A declared assumption makes estimates and later tradeoffs reviewable."}], "lab": null, "id": "legacy-0", "legacyIndex": 0, "plain": "An interview asks you to make decisions with incomplete information. Begin by agreeing on the user actions and the qualities that matter.", "analogy": "Before designing a house, agree on the rooms, budget, and who will live there.", "steps": ["Ask who uses the product and for what.", "State scale and quality assumptions.", "Choose a limited scope and explain it."], "terms": [["Scope", "The features and boundaries included in this design."], ["DAU", "Daily active users: distinct active users per day."], ["p99", "A latency threshold met by 99% of measured requests."]], "stage": 5}, {"title": "Architecture tradeoffs & deep dives", "group": "06 · Practice professional decisions", "minutes": 40, "goal": "Evolve a baseline and defend its most important decision.", "sections": [["Build the smallest complete path", "Start with clients, a service, and a storage model that can execute the main journey. Trace a write and a read, including errors. Split services only when independent scaling, ownership, deployment, or fault isolation warrants the extra coordination. A modular monolith can be a sound starting point."], ["Choose the bottleneck with evidence", "Estimate what saturates first and propose one change at a time. A read-heavy object lookup might need caching; an expensive query might need an index; a media service might need object storage and CDN; a write-heavy stream might need partitioning. Explain which metric would confirm the hypothesis and what new failure you introduce."], ["Discuss alternatives fairly", "For each key choice, compare two plausible options using requirements: consistency, tail latency, operational cost, durability, and complexity. Event-driven architecture provides independent consumers but introduces lag, schemas, replay, and duplicate work. Active-active regions can reduce some latency and failure impact but complicate ownership and conflicts."], ["End with a credible limitation", "Summarize the request flow, the largest tradeoff, and one unresolved risk with a mitigation. Explain what changes at 10× scale. Avoid promising that horizontal scaling fixes every bottleneck. A hot key, shared lock, external quota, or cross-region coordination can dominate even with many application servers."]], "example": "“I would begin with one write leader and regional read replicas. It simplifies ownership and prevents conflicting updates. Remote writes pay regional latency; if that violates the target, I would revisit ownership by region rather than merely add leaders.”", "tradeoff": "Microservices add independent deployment and ownership but also network failure, tracing, compatibility, and distributed workflow costs. Use team and workload boundaries as evidence.", "prompt": "Choose one case study below. Explain the first 10× bottleneck, an alternative design, and a failure introduced by your change.", "answer": "For a URL shortener, a cache can reduce database reads, but failure sends a sudden wave to the source. Compare read replicas with caching, describe freshness and load shedding, and monitor cache misses plus database latency. A celebrity URL may still need per-key coalescing.", "quiz": [{"q": "The best reason to add a component is…", "opts": ["It appears in many interview diagrams", "It resolves a stated requirement or evidenced bottleneck", "It increases the number of services"], "a": 1, "why": "Every component needs a responsibility, a reason, and a failure story."}, {"q": "A good 10× scale discussion includes…", "opts": ["Only ten times more application servers", "The likely limiting resource and its access pattern", "Only a new programming language"], "a": 1, "why": "Capacity often concentrates in storage, a key, a dependency, or coordination."}], "lab": null, "id": "legacy-10", "legacyIndex": 10, "plain": "A strong design connects every component to a requirement or measured bottleneck. Compare plausible alternatives and explain the limit.", "analogy": "Choose a delivery van using parcel size, route, and cost rather than its popularity.", "steps": ["Build one working path first.", "Identify the actual limiting resource.", "Compare two options and name the downside."], "terms": [["Monolith", "An application deployed as one main unit."], ["Microservices", "Separately operated services with explicit communication boundaries."], ["Deep dive", "Detailed exploration of one important part of a design."]], "stage": 5}, {"id": "adr", "title": "Write an architecture decision record", "goal": "Document the reason, alternative, and consequence of a choice.", "plain": "An architecture decision record, or ADR, is a short explanation of one important decision. It preserves the context so others can review or revisit it.", "analogy": "A shop manager writes why they chose next-day delivery over same-day delivery, what it costs, and when to reconsider. The decision is easier to understand months later.", "steps": ["State the problem and constraints.", "Compare a few plausible options.", "Record the choice, consequences, and revisit trigger."], "sections": [["Keep it concrete", "Use a title, status, context, options, decision, consequences, and validation. Avoid “we use tool X because it scales.” State which query or invariant matters and what evidence supports the choice."], ["Explain rejected alternatives", "An alternative can be reasonable but not chosen for current needs. If you choose cache-aside for public catalog reads, compare it with direct reads plus replicas. Discuss stale data and cache failure; do not claim the alternative is foolish."], ["Revisit with a trigger", "A decision is tied to assumptions. Set a measurable trigger, such as unacceptable source-read load, a required revocation interval, or region expansion. An ADR should help future teams understand when its original reasoning no longer holds."]], "example": "ADR: cache public book metadata for a bounded period. Context: repeated read load; checkout still reads authoritative price. Consequence: catalog display can lag. Revisit if revocation or freshness requirements tighten.", "tradeoff": "Long documents are hard to maintain. A focused decision note keeps reasoning discoverable without replacing detailed implementation specifications.", "prompt": "Write an ADR for the shop’s first cache: context, two options, choice, downside, and one revisit trigger.", "answer": "Compare direct database reads versus cache-aside. Choose cache-aside for repeated public catalog reads, keep checkout authoritative, bound stale display data, and revisit if invalidation requirements become stricter.", "terms": [["ADR", "A short record of an important architecture decision."], ["Constraint", "A limit or requirement the design must satisfy."], ["Revisit trigger", "Evidence that the decision’s assumptions may have changed."]], "quiz": [{"q": "A useful ADR includes…", "opts": ["Context and consequences", "Only a product name", "A claim that no alternatives exist"], "a": 0, "why": "It records reasoning."}, {"q": "A decision should be revisited when…", "opts": ["Its supporting assumptions change", "Never", "The document is exactly one month old"], "a": 0, "why": "Evidence and requirements drive revision."}], "minutes": 25, "lab": null, "stage": 5, "group": "06 · Practice professional decisions"}, {"id": "regions", "title": "Design across regions", "goal": "Choose data ownership before adding global copies.", "plain": "A region is a geographic deployment area. More regions can help nearby users and recovery, but updates now cross longer and less reliable paths.", "analogy": "Several shop branches may each sell their own inventory, or share one central inventory authority. They need different coordination rules.", "steps": ["State why a second region is needed.", "Define which region owns each write or invariant.", "Explain routing, failover, and conflicts."], "sections": [["Two basic patterns", "Active-passive keeps one primary write region and another ready for recovery. Active-active serves traffic from more than one region, but does not by itself say whether both may write the same record. Define ownership per record or operation."], ["Distance has a cost", "Cross-region coordination adds network delay and another failure dependency. Local replicas can make reads faster if freshness allows. A strict global inventory decision may still require reaching its authority. Avoid promising immediate worldwide correctness and unconstrained local progress during partitions."], ["Failover needs evidence", "Define the recovery point, readiness checks, and how the old authority is prevented from conflicting after a promotion. Decide how clients learn the correct region and how uncertain operations are reconciled. Test the procedure under realistic delays."]], "example": "Assign each account a home region for authoritative profile writes. Nearby regions can serve appropriate reads; moving ownership requires a controlled transfer and a plan for stale routing.", "tradeoff": "More regions can improve some latency and failure isolation while increasing coordination, deployment, data residency, and operating complexity.", "prompt": "For stock shared worldwide, compare one write authority with independent regional stock pools. What assumption changes?", "answer": "A global authority simplifies the invariant but remote requests pay coordination latency. Regional pools localize decisions but require allocation and transfer rules; one region’s unused stock may be unavailable to another until reallocated.", "terms": [["Region", "A geographic deployment area."], ["Active-passive", "A primary serving/write role with a prepared recovery deployment."], ["Active-active", "Multiple deployments serve traffic; ownership still needs definition."]], "quiz": [{"q": "Active-active automatically means safe independent writes to every record.", "opts": ["True", "False; ownership and conflict rules are still required"], "a": 1, "why": "Serving traffic and coordinating writes are separate concerns."}, {"q": "Cross-region coordination may increase…", "opts": ["Latency and dependence on remote connectivity", "Only browser font size", "Guaranteed local availability in every partition"], "a": 0, "why": "Distance and remote communication affect the critical path."}], "minutes": 30, "lab": null, "stage": 5, "group": "06 · Practice professional decisions"}, {"id": "validate", "title": "Validate a design like an engineer", "goal": "Turn claims into evidence with prototypes and failure checks.", "plain": "A professional design is a hypothesis you test. A diagram and course completion are not proof that a real implementation meets its requirements.", "analogy": "A bridge design needs calculations, material tests, and inspection. A software design also needs evidence, scaled to the risk.", "steps": ["Choose a claim to validate.", "Build or inspect the smallest thing that tests it.", "Record results, limits, and the next adjustment."], "sections": [["Test an important claim", "If you claim an index supports a query, measure its plan and latency on representative data. If you claim a worker is idempotent, deliver the same job twice and inspect the durable effect. A small prototype can settle one uncertain question without building the whole product."], ["Make failure checks meaningful", "Stop a worker after a side effect but before acknowledgment. Interrupt a storage connection. Restore a backup. Test unauthorized access using two separate accounts. The goal is to verify a specific invariant or recovery promise, not generate a huge test count."], ["Review with another person", "Present assumptions, measured outcomes, gaps, and one alternative. Ask a reviewer to challenge the busiest path and the ambiguous failure. Improve the design and update your ADR. Practical implementation, operational experience, and external feedback build professional competence over time."]], "example": "Claim: retrying the same order key creates one intended order. Validation: send duplicates concurrently, simulate a lost response, inspect durable order records, and verify the returned outcome. Record the provider boundary separately.", "tradeoff": "A prototype provides evidence for its tested conditions. It does not prove arbitrary production scale or every possible failure.", "prompt": "Choose one capstone invariant. Write a validation experiment, the expected result, and a limit of that experiment.", "answer": "Invariant: stock never goes negative. Send concurrent reservations for one remaining item and inspect durable stock and accepted reservations. Expect at most one success. This test alone does not prove all recovery, cancellation, or multi-region paths.", "terms": [["Invariant", "A property that must remain true through allowed operations."], ["Prototype", "A small implementation used to examine a specific uncertainty."], ["Evidence", "Observed results supporting a claim under stated conditions."]], "quiz": [{"q": "A clean architecture diagram proves production readiness.", "opts": ["True", "False; behavior and operations need validation"], "a": 1, "why": "Visual clarity is useful but not empirical proof."}, {"q": "An effective validation exercise starts with…", "opts": ["A specific claim or invariant", "Every possible tool", "A promise of unlimited scale"], "a": 0, "why": "The question determines the experiment."}], "minutes": 30, "lab": null, "stage": 5, "group": "06 · Practice professional decisions"}, {"title": "Run the interview", "group": "06 · Practice professional decisions", "minutes": 45, "goal": "Practice a coherent 45-minute explanation and assess it honestly.", "sections": [["Rehearse aloud", "Pick a prompt, hide the reference solution, start the mock timer, and speak while writing. Ask clarifying questions even in solo practice, then explicitly answer them as assumptions. Pause after the high-level design to choose a deep dive. Practice explaining a request without pointing at unnamed arrows."], ["Use the worksheet", "Capture requirements, estimates, API/data model, architecture and flows, deep dive, and failure/security behavior. The mock workspace saves these fields locally. Its rubric is a self-assessment, not an automated hiring score. Evidence matters: a “2” requires an explanation you could defend with a concrete example."], ["Respond to changes", "Midway through, add a constraint such as a 10× traffic burst, a zone outage, or read-your-writes across devices. State which previous assumption breaks, then adjust the design. Preserve core invariants while degrading optional behavior. Revisit estimates rather than quietly adding boxes."], ["Review and repeat", "After the timer, compare with the case guide. Write three gaps and one focused exercise. Repeat the same prompt after studying the weak topic, then transfer the idea to another case. Completion of this course means practice coverage, not guaranteed interview readiness. Ask a peer to challenge your consistency and failure claims."]], "example": "A useful ending: “Reads go through the cache with a bounded fallback. Writes commit on the leader and publish via an outbox. This favors predictable ownership but risks hot keys and relay lag. Next I would validate skew and recovery under cache loss.”", "tradeoff": "Memorized architectures are fast to recite but brittle when constraints change. Repeated reasoning practice takes more effort and transfers across prompts.", "prompt": "Complete a 45-minute mock without opening its guide. Record one assumption that changed, one rejected alternative, and one recovery scenario.", "answer": "Use your saved worksheet and rubric. Check whether every critical arrow has a protocol/data payload, every number has units, and every claimed guarantee has a failure behavior. Then choose one weak module to revisit.", "quiz": [{"q": "When a new requirement invalidates your design, you should…", "opts": ["Hide the mismatch", "State the broken assumption and revise the affected path", "Restart by listing every known technology"], "a": 1, "why": "A design interview tests adaptation as well as the baseline."}, {"q": "A self-assessment rubric is…", "opts": ["A guaranteed prediction of hiring outcomes", "A way to identify gaps for targeted practice", "A replacement for explaining your decisions"], "a": 1, "why": "Use evidence and peer feedback; a numeric score alone cannot assess interview performance."}], "lab": null, "id": "legacy-11", "legacyIndex": 11, "plain": "Use a timed exercise to tell a coherent story: need, scale, data, flows, tradeoff, and recovery. Then find a gap to improve.", "analogy": "Practice presenting a plan to a colleague who asks what happens if the busiest counter closes.", "steps": ["Explain one complete design aloud.", "Introduce a changed assumption or failure.", "Review evidence, gaps, and the next focused practice."], "terms": [["Rubric", "Criteria used to examine coverage and quality."], ["Mock interview", "A rehearsal of an interview conversation."], ["Failure scenario", "A concrete condition under which the normal path stops working."]], "stage": 5}], "cases": [{"title": "URL shortener", "level": "Starter", "time": 45, "prompt": "Design a public URL shortening service. Support create, redirect, and expiry. Assume 10M daily readers with 20 redirects each; 1M new links/day; 1-year retention. Explore a viral link and abuse.", "requirements": "Prioritize redirects, set an explicit latency/availability target, and clarify custom aliases, mutability, expiry, analytics, and malicious destinations. Assume 10× read peaks. Public links are bearer references; private links need a separate access model.", "estimate": "200M redirects/day ≈ 2.3K average and 23K peak QPS. At 500 bytes/link, 365M links occupy 182.5 GB raw before replicas, indexes, and backups. Analytics can generate much more event data than link metadata.", "api": "POST /links {url, expires_at?, alias?} → {code}; GET /{code} → redirect or expired/not-found. links(code PRIMARY KEY, destination, owner_id, expires_at). Validate protocols and ownership for edits; enforce alias uniqueness atomically.", "flow": "Create → validate and rate-limit → generate candidate code → unique insert, retry collisions → return. Redirect → check cache → fetch source on miss → validate expiry → return redirect. Emit analytics asynchronously. Code length depends on collision probability, volume, and abuse; encoding is not encryption.", "deep": "Cache public mappings and coalesce viral-key misses. Random codes avoid sequential enumeration patterns but need collision checks. Compare temporary and permanent redirect caching. If edits are allowed, discuss stale cached destinations and revocation. Avoid server-side fetching of arbitrary URLs unless its network access is safely constrained.", "failure": "Cache loss: cap source concurrency and shed excess load. Database unavailable: serve unexpired cached mappings within an agreed policy. Async analytics outage should not block redirects. Expiry must be checked even if a cache entry remains.", "follow": "A link must be revoked globally within 5 seconds. Which caches and browser behaviors affect your promise?", "nodes": ["Client", "Edge / limiter", "Link API", "Cache", "Link database", "Event queue", "Analytics workers"], "edges": [[0, 1, "HTTPS"], [1, 2, "route"], [2, 3, "lookup"], [2, 4, "miss / write"], [2, 5, "click event"], [5, 6, "consume"]], "plain": "Turn a long link into a short code, then send visitors to the original page.", "recommendedStage": 3}, {"title": "News feed", "level": "Intermediate", "time": 45, "prompt": "Design a following-based news feed. Assume 5M DAU, 10 feed reads and 2 posts/user/day. Most users follow 200 accounts; a few have millions of followers. Start with chronological ordering.", "requirements": "Clarify chronological versus ranked, private accounts, pagination, edit/delete visibility, and acceptable feed delay. Support post, follow, and page through a feed. Media bytes live separately from metadata.", "estimate": "50M feed reads/day ≈ 579 average QPS; 10M posts/day ≈ 116 average writes/sec. If each ordinary author has 200 followers, naive push can create roughly 2B feed insertions/day under that simplifying assumption. Follower distribution, not its mean alone, controls fan-out cost.", "api": "POST /posts; POST /follows; GET /feed?cursor=… . posts(post_id, author_id, created_at, body, media_ref); follows(follower_id, followee_id); feed_entries(user_id, time_key, post_id). Compound time/ID cursors avoid ambiguous boundaries.", "flow": "Post commits and adds an outbox event. Workers push post references into ordinary followers’ feed stores. Read fetches references, hydrates post metadata, and merges pull-based celebrity posts. Cache bounded recent pages; enforce visibility during reads even if fan-out is stale.", "deep": "Push makes reads cheap but amplifies writes. Pull makes writes cheap but requires read-time merging. A hybrid separates high-fan-out authors and active/inactive recipients. Bound worker batches, partition by recipient, and monitor lag. Ranking adds a separate retrieval and scoring discussion.", "failure": "Deduplicate feed entries by user/post ID. Use replayable events to rebuild derived feeds. A deleted post may leave references; filter tombstoned or unauthorized posts during hydration. Backpressure fan-out and degrade to a simpler feed when ranking fails.", "follow": "A celebrity publishes to 50M followers while queue lag rises. Which work should move to the read path?", "nodes": ["Client", "Feed API", "Feed cache", "Feed store", "Post database", "Event queue", "Fan-out workers"], "edges": [[0, 1, "read / post"], [1, 2, "recent page"], [1, 3, "references"], [1, 4, "post / hydrate"], [4, 5, "outbox relay"], [5, 6, "consume"], [6, 3, "push entries"]], "plain": "Show people new posts from the accounts they follow.", "recommendedStage": 4}, {"title": "Messaging service", "level": "Intermediate", "time": 45, "prompt": "Design one-to-one and small-group messaging. Assume 1M concurrently connected users and 100M messages/day. Include offline delivery and multiple devices. Clarify ordering and delivery receipts.", "requirements": "Distinguish accepted, delivered to a device, and read by a person. Clarify retention, maximum group size, encryption, and ordering scope. Assume per-conversation ordering; avoid claiming a global total order.", "estimate": "100M messages/day ≈ 1,157 average messages/sec. At 1 KB/message, 30 days is 3 TB raw. Connection count drives gateway memory and sockets separately from message throughput; fan-out grows with participants and devices.", "api": "WebSocket SEND {client_message_id, conversation_id, body}; ACK {server_id, sequence}; GET /conversations/{id}/messages?after=sequence. Store members, messages keyed by conversation/sequence, and per-device delivery cursors. Authorize membership on send and fetch.", "flow": "Gateway authenticates a connection and records its location. Message service validates membership, deduplicates client ID, assigns ordering within the conversation authority, and durably stores the message before accepted ACK. Delivery workers route to online gateways. Offline clients reconnect and fetch after their cursor.", "deep": "Partition conversations across ordering owners. Reconnect storms require admission limits and exponential backoff. Maintain location records with heartbeat expiry; routing errors fall back to durable fetch. Device ACK is not proof a person read the message. End-to-end encryption changes key management and server-side features.", "failure": "After a lost accepted ACK, retry the same message ID. Durable deduplication prevents duplicate message records. Gateway failure loses connections, not history. Re-fetch by sequence; detect gaps and handle retention expiry. Failover of ordering owners needs fenced ownership to avoid split writers.", "follow": "A gateway zone fails and 300K clients reconnect. Explain protection for login, synchronization, and routing.", "nodes": ["Devices", "Connection gateway", "Message service", "Message store", "Delivery queue", "Delivery workers", "Location registry"], "edges": [[0, 1, "WebSocket"], [1, 2, "send"], [2, 3, "durable commit"], [2, 4, "delivery event"], [4, 5, "consume"], [5, 6, "find device"], [5, 1, "push"]], "plain": "Send messages between people, including devices that reconnect later.", "recommendedStage": 4}, {"title": "Distributed rate limiter", "level": "Intermediate", "time": 45, "prompt": "Design a per-account API rate limiter for 100K peak requests/sec across three regions. Support endpoint costs and bursts. Discuss exact global quotas versus approximate regional budgets.", "requirements": "Specify account/IP identity, authenticated versus anonymous callers, refill rate, burst capacity, enforcement window, and strictness. Protect expensive endpoints differently from cheap ones. Decide whether quotas are contractual or abuse-control approximations.", "estimate": "One remote limiter operation per request means up to 100K operations/sec before replication. Number of active identity/endpoint buckets controls memory. Multi-region latency makes a single global decision store expensive; estimate added p99 latency and skew by region.", "api": "allow(account, endpoint, cost, request_id) → {allowed, remaining, retry_after}. Store tokens and last_refill per bucket. Atomically refill and debit using server time under one authority. A rejected request should not debit; ambiguous retries need an explicit charging policy.", "flow": "Gateway validates identity, finds endpoint policy, calls or executes the limiter, then permits or returns 429. A centralized atomic store can serialize a bucket. Approximate regional/local budgets allocate a portion of the global allowance and periodically rebalance.", "deep": "A local per-instance bucket accidentally multiplies allowance when instances scale. Divide budgets or use shared regional state. Exact global quotas during partitions require rejecting or deferring some decisions; accepting everywhere may overshoot. Hot accounts can be a hot key even when account keys are hashed.", "failure": "Limiter outage: fail closed for high-risk or costly writes, or use a conservative local emergency budget. Document overshoot bounds and user impact. Monitor rejects, store latency, quota skew, and fallback activations. Avoid high-cardinality unbounded state from spoofed identities.", "follow": "The global store is unreachable from one region. Can you promise both exact quota enforcement and unrestricted local decisions?", "nodes": ["Client", "API gateway", "Policy cache", "Limiter service", "Atomic bucket store", "Application"], "edges": [[0, 1, "request"], [1, 2, "endpoint policy"], [1, 3, "allow?"], [3, 4, "atomic debit"], [1, 5, "if allowed"]], "plain": "Give each caller a fair allowance so one caller cannot overwhelm the service.", "recommendedStage": 5}, {"title": "File storage & sharing", "level": "Intermediate", "time": 45, "prompt": "Design file upload, download, and sharing. Assume 1M users upload two 5 MB files/day, retained for 30 days. Include resumable upload, access revocation, and duplicate completion requests.", "requirements": "Separate file metadata from bytes. Clarify max size, private/public sharing, versioning, malware scanning, and deletion. State whether a file becomes visible only after scan and verification. Define revocation expectations for signed URLs and cached copies.", "estimate": "2M uploads/day × 5 MB = 10 TB/day and 300 TB raw for 30 days, before copies and versions. Average ingress ≈116 MB/sec, about 926 Mbps decimal. Download demand must be estimated separately; metadata QPS is not the byte bandwidth.", "api": "POST /uploads → scoped multipart upload information; POST /uploads/{id}/complete with part references; GET /files/{id}/download → authorized short-lived URL. files(id, owner, object_key, version, size, hash, status); permissions(file_id, principal, role).", "flow": "Client initializes after quota and ACL checks, uploads parts directly to object storage, and completes idempotently. Verify object existence, size, and checksum; scan asynchronously; mark ready only after required checks. Download checks current ACL before issuing a scoped URL or streaming through an authorized path.", "deep": "Resumable parts avoid restarting large files. Keep orphan cleanup and quota accounting idempotent. Deduplication is a privacy and access-control problem as well as a storage optimization. Global content hashes can leak whether another user owns a file; be explicit about scope and policy.", "failure": "Multipart abandonment needs TTL cleanup. Metadata and object state can disagree, so use a state machine and reconciliation. An issued signed URL may remain valid until expiry after ACL revocation; for stricter revocation use a checked proxy or suitable edge authorization.", "follow": "A shared file must become inaccessible immediately after revocation. Revisit signed URLs, browser caches, and bytes already downloaded.", "nodes": ["Client", "Metadata API", "Metadata / ACL DB", "Object storage", "Scan queue", "Scan workers", "Download edge"], "edges": [[0, 1, "initialize / authorize"], [1, 2, "state / ACL"], [0, 3, "multipart upload"], [1, 4, "scan job"], [4, 5, "consume"], [5, 3, "read / verify"], [0, 6, "download"], [6, 3, "authorized bytes"]], "plain": "Upload files, remember who may access them, and share them safely.", "recommendedStage": 4}, {"title": "Orders & payment workflow", "level": "Advanced", "time": 45, "prompt": "Design checkout with inventory, payment, and order status. Assume 1K peak checkouts/sec. The payment provider can time out after charging. Inventory is scarce and orders must not silently double-charge.", "requirements": "Clarify reserve versus charge timing, reservation expiry, cancellations, refunds, and provider idempotency. Define invariants: no negative stock, one intended charge per attempt, and a recoverable outcome. A network timeout is an unknown outcome.", "estimate": "1K checkouts/sec means at least several thousand storage/state operations/sec depending on the workflow. External provider rate limits and tail latency can dominate. At 2 seconds average pending time, roughly 2K in-flight attempts exist in a stable simplified model.", "api": "POST /orders with user-scoped idempotency key; GET /orders/{id}; POST /orders/{id}/cancel. Store order state/version, reservation ownership/expiry, payment_attempt_id, provider reference, and deduplicated event IDs. Use monotonic legal state transitions.", "flow": "Create an order and reserve stock atomically in the inventory authority. Persist a payment attempt, call the provider with its stable idempotency key, then record success or an uncertain/pending state. Commit outbox events with local transitions. A saga coordinates completion or compensation across services.", "deep": "A saga uses explicit compensating actions instead of assuming a transaction spans the provider. Payment success followed by order failure may require a refund; refund also needs idempotency and reconciliation. Prevent reservation expiry from racing order completion through atomic ownership/version checks.", "failure": "Reconcile uncertain payments from provider status and authenticated webhook events. Deduplicate callbacks, check valid transitions, and provide an operator path for stuck states. Persist retry budgets. Do not release stock and blindly retry a payment whose result is unknown.", "follow": "Payment succeeds, the client times out, and the reservation expires. Identify the recovery state and each invariant you must protect.", "nodes": ["Client", "Order API", "Order database", "Inventory authority", "Payment provider", "Outbox / queue", "Recovery workers"], "edges": [[0, 1, "idempotent create"], [1, 2, "order transition"], [1, 3, "reserve / release"], [1, 4, "stable attempt ID"], [2, 5, "outbox relay"], [5, 6, "reconcile"], [6, 4, "status / refund"]], "plain": "Record orders and protect stock and payment rules when requests repeat or fail.", "recommendedStage": 6}], "stages": [{"title": "Start from zero", "label": "Beginner", "desc": "Learn what a system is and follow your first request.", "outcome": "Explain a simple website to someone who has never built one.", "story": "Our bookshop has one application and a saved list of books.", "project": "Sketch a three-box bookshop and explain a lookup aloud.", "lessonIndices": [0, 1, 2, 3, 4, 5]}, {"title": "Build a working product", "label": "Foundation", "desc": "Define features, APIs, data rules, and permissions.", "outcome": "Design a complete, secure single-region baseline.", "story": "The shop adds accounts and orders. Data rules now matter.", "project": "Specify order APIs, a small schema, and an ownership check.", "lessonIndices": [6, 7, 8, 9, 10]}, {"title": "Handle more traffic", "label": "Intermediate", "desc": "Measure demand, speed up reads, and divide the load.", "outcome": "Choose a scaling change and explain the bottleneck it solves.", "story": "More customers arrive. We measure before adding servers or caches.", "project": "Estimate demand, add a cache, and describe a cache-outage plan.", "lessonIndices": [11, 12, 13, 14, 15]}, {"title": "Coordinate distributed work", "label": "Intermediate", "desc": "Understand copies, consistency, queues, and agreement.", "outcome": "Explain stale reads, duplicate jobs, and ownership during failures.", "story": "The shop maintains replicas, queues emails, and builds a search view.", "project": "Trace an order event through an outbox and a retry-safe worker.", "lessonIndices": [16, 17, 18, 19, 20]}, {"title": "Operate reliably", "label": "Advanced", "desc": "Contain overload, observe behavior, recover, and deploy safely.", "outcome": "Write an operating plan with measurable recovery and rollout checks.", "story": "The shop must stay understandable and recoverable through change.", "project": "Write a restore drill, permission check, and gradual rollout plan.", "lessonIndices": [21, 22, 23, 24, 25]}, {"title": "Practice professional decisions", "label": "Advanced", "desc": "Review tradeoffs, document decisions, validate, and rehearse.", "outcome": "Present a defensible design backed by a validation plan.", "story": "The shop expands to new regions. Every important choice needs evidence.", "project": "Finish the capstone, get a peer review, and run a timed interview.", "lessonIndices": [26, 27, 28, 29, 30, 31]}], "projects": [{"title": "Your first bookshop", "level": "Beginner", "desc": "Turn a user need into a small, understandable product.", "steps": ["State three user actions and one exclusion.", "Draw browser, application, and data store with labeled arrows.", "Define book and order records with stable IDs.", "Describe success, not-found, and unauthorized behavior."], "starter": "Start with: browse books, create an order, view my orders. Use a small catalog and one region.", "done": "Another person can trace a read and an order write; the order ownership check is explicit.", "build": "Optional implementation after learning basic programming: build a small list/read/create API and verify it with a browser or API client. No deployment is needed."}, {"title": "The shop gets busy", "level": "Intermediate", "desc": "Evolve your first design using measured assumptions.", "steps": ["Estimate average/peak reads and daily saved bytes with units.", "Choose one limiting resource and compare two fixes.", "Add cache-aside with explicit freshness and miss handling.", "Explain how the source is protected during cache loss."], "starter": "Assume 100,000 visitors/day, 20 reads and one new order each, with a 5× read peak. Keep the price check authoritative.", "done": "Every number has units; every new box has a reason and a failure policy.", "build": "Optional implementation: compare direct reads and cached reads under a small repeatable workload. Record hardware, data size, workload, and limitations; do not extrapolate blindly."}, {"title": "Recoverable order workflow", "level": "Advanced", "desc": "Protect inventory and payment behavior through uncertain outcomes.", "steps": ["Write the stock and payment invariants.", "Define order, reservation, and payment state transitions.", "Use stable attempt IDs, outbox publication, and duplicate handling.", "Specify reconciliation after payment timeout or worker crash."], "starter": "A payment can succeed even if its response is lost. Keep a pending/unknown state until you can determine the outcome.", "done": "Duplicate delivery and unknown payment outcomes have explicit, durable recovery paths.", "build": "Optional implementation: use a fake payment adapter, submit duplicate requests concurrently, and interrupt a worker at a stated boundary. Verify the invariant from durable records."}, {"title": "Architecture review portfolio", "level": "Professional practice", "desc": "Prepare a reviewable proposal and a plan for evidence.", "steps": ["Combine requirements, estimates, APIs, data model, and flow diagrams.", "Write two ADRs comparing reasonable alternatives.", "Document security boundaries, signals, recovery targets, and rollout checks.", "Plan a validation experiment; request peer feedback and record a revision."], "starter": "Use one region until another is justified. Add a 10× traffic or region-failure follow-up and state which assumption changes.", "done": "A reviewer can find the decision rationale, testable claims, operating plan, and remaining limitations.", "build": "Professional competence grows through implementation and operational feedback. Attach measured prototype results and a tested recovery procedure when you build the design."}]}</script>
<script>

'use strict';
const {lessons,cases,stages,projects}=JSON.parse(document.getElementById('course-data').textContent);
const KEY='systems-studio-v2';
const blank=()=>({version:2,projects:{},completed:[],answers:{},notes:{},caseNotes:{},known:[],mock:{case:0,fields:{},scores:{},remaining:2700},theme:'light',lastLesson:0});
let state=blank(),storageOK=true;
function validate(s){
 const obj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
 const strings=o=>obj(o)&&Object.values(o).every(v=>typeof v==='string'&&v.length<=500000);
 const indices=(a,max)=>Array.isArray(a)&&new Set(a).size===a.length&&a.every(x=>Number.isInteger(x)&&x>=0&&x<max);
 const keyIndex=(k,max)=>/^\d+$/.test(k)&&+k>=0&&+k<max;
 if(!obj(s)||s.version!==2||!indices(s.completed,lessons.length)||!indices(s.known,lessons.length)||!strings(s.notes)||!strings(s.caseNotes)||!obj(s.answers))return false;
 if(!Object.keys(s.notes).every(k=>keyIndex(k,lessons.length))||!Object.keys(s.caseNotes).every(k=>keyIndex(k,cases.length)))return false;
 if(!Object.entries(s.answers).every(([k,v])=>{const m=k.match(/^(\d+)-(\d+)$/);return m&&lessons[+m[1]]&&lessons[+m[1]].quiz[+m[2]]&&Number.isInteger(v)&&v>=0&&v<lessons[+m[1]].quiz[+m[2]].opts.length;}))return false;
 if(!obj(s.projects)||!Object.entries(s.projects).every(([k,v])=>keyIndex(k,projects.length)&&obj(v)&&indices(v.checks,projects[+k].steps.length)&&typeof v.notes==='string'&&v.notes.length<=500000))return false;
 if(!obj(s.mock)||!obj(s.mock.fields)||!obj(s.mock.scores))return false;
 const keys=['requirements','estimates','model','architecture','deep','recovery'];
 if(!Object.entries(s.mock.fields).every(([k,v])=>keyIndex(k,cases.length)&&strings(v)&&Object.keys(v).every(x=>keys.includes(x)||x==='gaps')))return false;
 if(!Object.entries(s.mock.scores).every(([k,v])=>keyIndex(k,cases.length)&&obj(v)&&Object.entries(v).every(([x,n])=>keys.includes(x)&&Number.isInteger(n)&&n>=0&&n<=2)))return false;
 return ['light','dark'].includes(s.theme)&&Number.isInteger(s.lastLesson)&&s.lastLesson>=0&&s.lastLesson<lessons.length&&Number.isInteger(s.mock.case)&&s.mock.case>=0&&s.mock.case<cases.length&&Number.isFinite(s.mock.remaining)&&s.mock.remaining>=0&&s.mock.remaining<=2700;
}
function normalizeProgress(s){
 if(!s||s.version!==1)return s;
 try{
  const map=i=>Number.isInteger(i)&&i>=0&&i<12?lessons.findIndex(l=>l.legacyIndex===i):-1;
  const notes=Object.fromEntries(Object.entries(s.notes).map(([k,v])=>[map(+k),v]));
  const answers=Object.fromEntries(Object.entries(s.answers).map(([k,v])=>{const m=k.match(/^(\d+)-(\d+)$/);if(!m)throw Error('answer key');return [map(+m[1])+'-'+m[2],v];}));
  return {...s,version:2,projects:{},completed:s.completed.map(map),known:s.known.map(map),notes,answers,lastLesson:map(s.lastLesson)};
 }catch(e){return null;}
}
try{const saved=normalizeProgress(JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('systems-studio-v1')));if(validate(saved))state=saved;}catch(e){storageOK=false;}
let selectedStage=-1;
let page='home',lesson=state.lastLesson,activeLab='request',activeCase=null,cardIndex=0,cardFlipped=false,reviewAll=false,running=false,deadline=0,tick=null,toastTimeout;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}updateProgress();}

st').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(+b.dataset.lesson);};}

const labNames={request:'Request journey',capacity:'Capacity planner',cache:'Cache tradeoffs',quorum:'Quorum explorer',queue:'Queue backlog',bucket:'Token bucket'};
function input(id,label,val,min,max,step=1){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="number" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;}
function metric(label,val,unit=''){return `<div class="metric"><small>${label}</small><div class="stat">${val} <small>${unit}</small></div></div>`;}
const fmt=(n,d=0)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d});

function wire(ids,fn){ids.forEach(id=>$(id).oninput=fn);fn();}
function values(ids){const v=ids.map(id=>Number($(id).value));const ok=ids.every((id,i)=>$(id).value!==''&&$(id).checkValidity()&&Number.isFinite(v[i]));return ok?v:null;}
function invalid(id){$(id).innerHTML='<p class="warning" role="alert">Enter valid numbers within the displayed input bounds.</p>';}
function capacityLab(){ $('lab').innerHTML=`<div class="grid"><div class="panel"><h3>Plan the request path</h3>${input('dau','Daily active users (1–1 billion)',10000000,1,1000000000)}${input('reads','Reads / user / day (0–10,000)',20,0,10000)}${input('writes','Writes / user / day (0–10,000)',.1,0,10000,.01)}${input('peak','Peak multiplier (1–100)',10,1,100)}${input('bytes','Record size · bytes (1–1 million)',500,1,1000000)}${input('days','Retention · days (1–3,650)',365,1,3650)}${input('copies','Stored data copies (1–9)',3,1,9)}${input('qps','Measured QPS / instance (1–1 million)',500,1,1000000)}${input('util','Planned utilization · % (10–90)',60,10,90)}</div><div><div class="panel" id="capacity-result" aria-live="polite"></div><div class="callout"><h3>Try this</h3><p>Double record size. Which traffic metrics stay the same? Then increase peak traffic. Explain why daily storage does not change.</p></div><p class="muted">Instance count models read-serving capacity only. Writes, index overhead, bandwidth, skew, replica traffic, zone redundancy, and burst concurrency need separate sizing.</p></div></div>`;
wire(['dau','reads','writes','peak','bytes','days','copies','qps','util'],()=>{const v=values(['dau','reads','writes','peak','bytes','days','copies','qps','util']);if(!v)return invalid('capacity-result');const [d,r,w,p,b,t,c,q,u]=v,avg=d*r/86400,pk=avg*p,gb=d*w*b*t/1e9,n=pk>0?Math.ceil(pk/(q*u/100)):0;$('capacity-result').innerHTML=`<h3>From assumptions to scale</h3><div class="metricgrid">${metric('Average reads',fmt(avg,1),'QPS')}${metric('Peak reads',fmt(pk,1),'QPS')}${metric('Average writes',fmt(d*w/86400,1),'QPS')}${metric('Raw retained data',fmt(gb,2),'GB')}${metric('Data including copies',fmt(gb*c,2),'GB')}${metric('Read-serving instances',fmt(n),'minimum')}</div><div class="formula">read QPS = DAU × reads ÷ 86,400<br>raw bytes = DAU × writes × size × days<br>instances = ceil(peak QPS ÷ (QPS/instance × utilization))</div>`;});}
function cacheLab(){ $('lab').innerHTML=`<div class="grid"><div class="panel"><h3>Where do reads go?</h3>${input('traffic','Incoming read QPS (1–1 million)',10000,1,1000000)}<div class="field"><label for="hit">Cache hit rate · <span id="hit-value">90%</span></label><input type="range" id="hit" min="0" max="100" value="90"></div>${input('cl','Cache lookup latency · ms (0–1,000)',2,0,1000,.1)}${input('dl','Source read latency · ms (1–10,000)',50,1,10000)}${input('sourcecap','Source capacity · QPS (1–1 million)',2000,1,1000000)}<label class="option"><input type="checkbox" id="outage">Simulate cache outage (bypass lookup)</label></div><div><div class="panel" id="cache-result" aria-live="polite"></div><div class="callout"><h3>Try this</h3><p>Raise the hit rate to 99%, then fail the cache. What load increase must your fallback absorb? Choose a load-shedding policy.</p></div><p class="muted">Latency is an arithmetic mean using fixed costs, not a p99 estimate. Misses pay cache + source time. Source latency is assumed constant even under overload; the warning identifies where that assumption breaks.</p></div></div>`;
const update=()=>{const v=values(['traffic','hit','cl','dl','sourcecap']);if(!v)return invalid('cache-result');const [q,h,c,d,cap]=v,out=$('outage').checked,hit=out?0:h/100,source=q*(1-hit),lat=out?d:c+(1-hit)*d;$('hit-value').textContent=h+'%';$('cache-result').innerHTML=`<h3>${out?'Cache unavailable':'Cache-aside model'}</h3><div class="barrow"><span>Cache hits</span><div class="bar"><i style="width:${100*hit}%"></i></div><b>${fmt(q*hit)}</b></div><div class="barrow"><span>Source reads</span><div class="bar"><i style="width:${100*(1-hit)}%"></i></div><b>${fmt(source)}</b></div><div class="metricgrid">${metric('Mean modeled latency',fmt(lat,1),'ms')}${metric('Source utilization',fmt(source/cap*100,1),'%')}</div><p class="${source>cap?'warning':'muted'}">${source>cap?'Source capacity exceeded. A real queue, tail latency, and errors may grow; the constant-latency model is no longer reliable.':'Within the supplied source capacity. Reserve headroom for skew, bursts, and writes.'}</p>`;};wire(['traffic','hit','cl','dl','sourcecap','outage'],update);}
function quorumLab(){ $('lab').innerHTML=`<div class="grid"><div class="panel"><h3>One fixed replica set</h3>${input('n','N · replicas (1–9)',3,1,9)}${input('r','R · read responses required (1–9)',2,1,9)}${input('w','W · write acknowledgments required (1–9)',2,1,9)}${input('failed','Unavailable replicas (0–9)',0,0,9)}</div><div class="panel" id="quorum-result" aria-live="polite"></div></div><div class="callout"><h3>Try this</h3><p>Use N=3, R=1, W=3. You have guaranteed overlap, but how many replica failures can the write path tolerate? Then compare R=2, W=2.</p></div><p class="muted">This explorer shows set overlap and response counts only. It does not simulate leader election, partitions, durability, read repair, concurrent writers, changing membership, or prove linearizability.</p>`;
wire(['n','r','w','failed'],()=>{const v=values(['n','r','w','failed']);if(!v)return invalid('quorum-result');const [n,r,w,f]=v;if(r>n||w>n||f>n){$('quorum-result').innerHTML='<p class="warning" role="alert">R, W, and unavailable replicas must not exceed N.</p>';return;}const live=n-f;$('quorum-result').innerHTML=`<h3>Counts are necessary, not sufficient.</h3><div class="flow">${Array.from({length:n},(_,i)=>`<span class="node">Replica ${i+1} ${i<live?'· online':'· down'}</span>`).join('')}</div><div class="metricgrid">${metric('Guaranteed overlap',r+w>n?'Yes':'No')}${metric('Reachable replicas',live+'/'+n)}${metric('Enough read responses',live>=r?'Yes':'No')}${metric('Enough write responses',live>=w?'Yes':'No')}</div><p class="formula">R + W = ${r+w}; N = ${n}<br>Minimum guaranteed intersection = max(0, R + W − N) = ${Math.max(0,r+w-n)}</p><p class="muted">Even with enough live replicas, actual protocol behavior may prevent progress. A real partition changes which replicas each caller can reach.</p>`;});}
function queueLab(){ $('lab').innerHTML=`<div class="grid"><div class="panel"><h3>Drain the backlog</h3>${input('arrival','Arrival rate · jobs/sec (0–100,000)',120,0,100000)}${input('workers','Worker count (1–1,000)',4,1,1000)}${input('speed','Each worker · jobs/sec (1–100,000)',25,1,100000)}${input('backlog','Starting backlog · jobs (0–10 million)',3000,0,10000000)}${input('horizon','Forecast horizon · minutes (1–120)',10,1,120)}</div><div class="panel" id="queue-result" aria-live="polite"></div></div><div class="callout"><h3>Try this</h3><p>Increase workers until capacity is just above arrivals. Notice how slowly the existing backlog drains. How much spare capacity would you need to recover in five minutes?</p></div><p class="muted">Fluid approximation with constant rates and independent workers. It ignores processing variance, poison messages, retries, partition limits, and downstream bottlenecks. Backlog / capacity is a rough queue wait, not total end-to-end time.</p>`;
wire(['arrival','workers','speed','backlog','horizon'],()=>{const v=values(['arrival','workers','speed','backlog','horizon']);if(!v)return invalid('queue-result');const [a,w,s,b,m]=v,cap=w*s,delta=a-cap,end=Math.max(0,b+delta*m*60),drain=cap>a?b/(cap-a):null;$('queue-result').innerHTML=`<h3>${delta>0?'Demand exceeds capacity':delta===0?'No recovery headroom':'Capacity exceeds demand'}</h3><div class="metricgrid">${metric('Processing capacity',fmt(cap),'jobs/sec')}${metric('Backlog change',fmt(delta),'jobs/sec')}${metric('Backlog after '+m+' min',fmt(end),'jobs')}${metric('Time to drain',b===0?'0':drain===null?'Never':fmt(drain/60,1),drain!==null||b===0?'min':'at these rates')}${metric('Initial queue wait',fmt(b/cap,1),'sec')}${metric('Minimum workers for spare capacity',Math.floor(a/s)+1)}</div><div class="flow"><span class="node">${fmt(a)}/s arriving</span><span class="arrow">→</span><span class="node">Queue</span><span class="arrow">→</span><span class="node">${fmt(cap)}/s processed</span></div><p class="formula">backlog(t) = max(0, backlog₀ + (arrival − capacity) × t)<br>drain time = backlog₀ ÷ (capacity − arrival), if capacity &gt; arrival</p>`;});}
let bucket={tokens:10,clock:0,allowed:0,rejected:0};
function bucketLab(){bucket={tokens:10,clock:0,allowed:0,rejected:0};$('lab').innerHTML=`<div class="grid"><div class="panel"><h3>Requests spend tokens</h3>${input('bucketcap','Capacity · tokens (1–1,000)',10,1,1000)}${input('refill','Refill · tokens/sec (0–100)',2,0,100,.1)}<button class="btn" id="reset-bucket">Apply settings & reset</button><hr><div class="row"><button class="btn primary" data-request="1">Send 1 request</button><button class="btn" data-request="10">Send burst of 10</button><button class="btn" id="advance">Advance 1 second</button></div><p class="sticky-note">Clock advances only when you press the time button. All requests in a burst arrive at the same simulated instant.</p></div><div class="panel" id="bucket-result" aria-live="polite"></div></div><div class="callout"><h3>Try this</h3><p>Send two bursts immediately. Advance five seconds, then retry. Explain why a burst quota and a sustained quota are different.</p></div><p class="muted">Single identity and single authority, with one token per request. Real distributed updates must be atomic. This lab intentionally uses a manually advanced clock.</p>`;
let cap=10,rate=2;const draw=()=>{$('bucket-result').innerHTML=`<h3>At t = ${bucket.clock} seconds</h3><div class="progress" role="progressbar" aria-label="Available tokens" aria-valuemin="0" aria-valuemax="${cap}" aria-valuenow="${bucket.tokens}"><span style="width:${100*bucket.tokens/cap}%"></span></div><div class="metricgrid">${metric('Available tokens',fmt(bucket.tokens,1),'/ '+cap)}${metric('Refill rate',rate,'tokens/sec')}${metric('Accepted',bucket.allowed,'requests')}${metric('Rejected',bucket.rejected,'requests')}</div><p class="formula">tokens = min(capacity, tokens + elapsed × refill)<br>allow request only if tokens ≥ 1</p>`;};$('reset-bucket').onclick=()=>{const v=values(['bucketcap','refill']);if(!v)return invalid('bucket-result');[cap,rate]=v;bucket={tokens:cap,clock:0,allowed:0,rejected:0};draw();};document.querySelectorAll('[data-request]').forEach(b=>b.onclick=()=>{for(let i=0;i<+b.dataset.request;i++){if(bucket.tokens>=1){bucket.tokens--;bucket.allowed++;}else bucket.rejected++;}draw();});$('advance').onclick=()=>{bucket.clock++;bucket.tokens=Math.min(cap,bucket.tokens+rate);draw();};draw();}

function resources(){const glossary=Array.from(new Map(lessons.flatMap(l=>l.terms)).entries()).sort((a,b)=>a[0].localeCompare(b[0]));$('main-content').innerHTML=heading('Keep a compact reference','Reason from the requirement.','Use these reminders after attempting an explanation. The course works offline; optional primary sources below require internet access.')+`<div class="grid"><div class="panel"><h3>The interview checklist</h3><ol><li>Users, journeys, exclusions, and quality targets.</li><li>Average and peak load with declared assumptions.</li><li>APIs, keys, schema, and correctness invariants.</li><li>One complete write path and read path.</li><li>A justified bottleneck deep dive and alternative.</li><li>Failures, security, monitoring, and recovery.</li><li>Summary, limitation, and 10× evolution.</li></ol></div><div class="panel"><h3>Useful equations</h3><pre>QPS = daily actions / 86,400

bandwidth = requests/sec × bytes

backlog growth/sec = arrival − capacity

const traceSteps=[['Browser','You ask to see book 42. The browser sends a request to the shop application.','Request: “show book 42”'],['Application','The application checks the request and asks its storage for book 42.','Lookup: book_id = 42'],['Database','The database finds the saved book record and returns it to the application.','Record: title and price'],['Response','The application sends the book details back. Your browser displays them.','Response: book details']];
function traceWidget(id){let step=0;const draw=()=>{$(id).innerHTML=`<div class="trace-track" aria-label="Request flow">${traceSteps.map(([name],i)=>`<button data-trace-step="${i}" class="trace-node ${i===step?'active':''}" aria-pressed="${i===step}"><span>${i+1}</span>${name}</button>`).join('')}</div><div class="trace-detail" aria-live="polite"><span class="tag">Step ${step+1} / 4</span><p>${traceSteps[step][1]}</p><code>${traceSteps[step][2]}</code></div><div class="row"><button class="btn" data-trace-prev ${step===0?'disabled':''}>← Previous step</button><button class="btn primary" data-trace-next>${step===3?'Start again':'Next step →'}</button></div>`;$(id).querySelector('[data-trace-prev]').onclick=()=>{step=Math.max(0,step-1);draw();};$(id).querySelector('[data-trace-next]').onclick=()=>{step=(step+1)%4;draw();};$(id).querySelectorAll('[data-trace-step]').forEach(b=>b.onclick=()=>{step=+b.dataset.traceStep;draw();});};draw();}
function requestLab(){$('lab').innerHTML=`<div class="grid"><section class="panel"><h3>From a click to saved information</h3><p class="muted">Follow one book lookup. Click any step or move through the sequence.</p><div id="lab-trace"></div></section><section class="panel"><div class="eyebrow">Then explain it yourself</div><h3>What changes when a part fails?</h3><p>At the application step, imagine the database cannot be reached. The application cannot safely invent the book’s saved details.</p><p>It might return a clear temporary error, or serve an allowed cached copy later in the course. The right choice depends on what the user needs.</p><div class="callout"><h3>Try this</h3><p>Trace “add a review” instead of “read a book.” Which step now changes saved data? Where would you check the user’s permission?</p></div></section></div>`;traceWidget('lab-trace');}
let activeProject=0;
function projectsView(){const p=projects[activeProject],saved=state.projects[activeProject]||{checks:[],notes:''};$('main-content').innerHTML=heading('Guided portfolio','Grow one design into a reviewable proposal.','Start with diagrams and written explanations. Optional builds add real evidence as you learn programming and operations.')+`<div class="lab-tabs" aria-label="Choose a portfolio project">${projects.map((p,i)=>`<button class="btn" data-project="${i}" aria-pressed="${i===activeProject}">${i+1}. ${p.title}</button>`).join('')}</div><div class="grid"><section class="panel"><span class="tag">${p.level}</span><h3 class="section">${p.title}</h3><p class="muted">${p.desc}</p><div class="project-checks">${p.steps.map((s,i)=>`<label class="option"><input type="checkbox" data-project-check="${i}" ${saved.checks.includes(i)?'checked':''}>${s}</label>`).join('')}</div><div class="callout"><h3>A starting point</h3><p>${p.starter}</p></div><small>These checkboxes record your own assessment. They do not validate your work.</small></section><section><div class="field"><label for="project-notes">Your design, decisions, and evidence</label><textarea id="project-notes" rows="15" maxlength="500000" placeholder="Write the design, important assumptions, testable claims, and feedback…">${esc(saved.notes)}</textarea><small>Saved locally. Export all progress to keep a backup.</small></div><button class="btn" id="export-project">Export this project →</button></section></div><div class="grid section"><section class="panel"><h3>Ready for review when…</h3><p>${p.done}</p></section><section class="panel"><h3>Add implementation evidence</h3><p>${p.build}</p></section></div><section class="career-banner section"><div><h3>Course progress is a starting point.</h3><p>Professional skill grows through building, measuring, operating, and learning from review. Keep the evidence and limitations alongside your design.</p></div><button class="btn" id="project-case">Practice interview cases →</button></section>${footer()}`;document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{activeProject=+b.dataset.project;projectsView();});const get=()=>state.projects[activeProject]||(state.projects[activeProject]={checks:[],notes:''});document.querySelectorAll('[data-project-check]').forEach(b=>b.onchange=()=>{const p=get(),i=+b.dataset.projectCheck;p.checks=p.checks.filter(x=>x!==i);if(b.checked)p.checks.push(i);save();});$('project-notes').oninput=e=>{get().notes=e.target.value;save();};$('export-project').onclick=()=>{const v=get();download('# '+p.title+'\n\n'+p.steps.map((s,i)=>(v.checks.includes(i)?'[x] ':'[ ] ')+s).join('\n')+'\n\n'+v.notes,'systems-studio-project-'+(activeProject+1)+'.txt','text/plain');};$('project-case').onclick=()=>go('cases');}

$('menu').onclick=()=>{const open=document.body.classList.toggle('menu-open');$('menu').setAttribute('aria-expanded',open?'true':'false');};
applyTheme();updateProgress();go('home',false);

</script></body></html>
