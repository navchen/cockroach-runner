">Progress stays in this browser.</span></div></aside><div class="main"><header class="topbar"><div class="row"><button id="menu" class="btn menu-toggle" aria-expanded="false" aria-controls="nav" aria-label="Toggle course menu">☰ Menu</button><div><span class="topbar-label">Systems Studio</span><span class="breadcrumb" id="breadcrumb">Learning dashboard</span></div></div><div class="row"><span class="offline-pill"><span class="online-dot"></span>Offline ready</span><button class="btn" id="theme" aria-label="Switch to dark theme">Dark theme</button></div></header><main id="main-content" class="content" tabindex="-1"></main></div></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div><script id="course-data" type="application/json">{"lessons": [{"id": "system", "title": "What is system design?", "goal": "Recognize the parts of a system and the job they do together.", "plain": "System design means deciding how the parts of a product work together so people can use it reliably. You begin with a user’s need, then choose the parts and the connections.", "analogy": "A café is a system: the customer orders, the cashier records it, the kitchen prepares it, and a runner delivers it. Software has a similar flow.", "steps": ["Name what the user wants to do.", "Choose the few parts needed to do it.", "Explain what happens when a part is slow or unavailable."], "sections": [["Start with an action", "Imagine a tiny online bookshop. A visitor wants to see available books. You need somewhere to display the page, some code to answer requests, and somewhere to keep the book information. You do not need dozens of services to get started."], ["Parts have responsibilities", "A responsibility is a job. The browser displays the result. The application applies rules, such as hiding out-of-stock books. Storage remembers facts. A connection between parts says what information moves. The same machine can run several parts at first."], ["Good design explains why", "There is no single best design for every product. A shop with ten customers and a shop with a million customers have different needs. A good designer explains the need, the choice, and the downside. This course follows a small shop as its needs grow."]], "example": "Our first design is simply: customer’s browser → shop application → stored book list. The application reads the list and sends it back to the browser.", "tradeoff": "Adding parts can help with a specific problem, but every extra part also needs to be maintained and can fail.", "prompt": "Choose an everyday system, such as a café or library. Name three parts and explain how they cooperate.", "answer": "A library has a visitor, a librarian, and a catalog. The visitor asks for a book; the librarian searches the catalog and returns its location. Each part has a clear responsibility.", "terms": [["System", "Parts working together toward a purpose."], ["Architecture", "The important parts of a system and how they connect."], ["Tradeoff", "A benefit you gain and a cost or limitation you accept."]], "quiz": [{"q": "What should you understand before choosing software components?", "opts": ["What the user needs to do", "The longest list of tools", "The logo"], "a": 0, "why": "Design begins with the purpose of the product."}, {"q": "Why explain the downside of a choice?", "opts": ["Every choice has costs and limits", "To make the diagram longer", "Because all designs must be complex"], "a": 0, "why": "Professional decisions are justified, including the cost of each benefit."}], "minutes": 20, "lab": null, "stage": 0, "group": "01 · Start from zero"}, {"id": "web", "title": "How a website works", "goal": "Explain browsers, servers, and the internet without prior experience.", "plain": "Your browser asks another computer for a page or information. That computer, called a server, responds. Your browser turns the response into what you see.", "analogy": "Ordering from a restaurant: you ask for an item; the kitchen prepares it; the waiter brings it back. A request and response are the software version.", "steps": ["The browser is the user’s side: it asks and displays.", "A server is the product’s side: it receives and answers.", "The network carries messages between them."], "sections": [["Two sides of the product", "A browser is a program such as Chrome, Safari, or Firefox. It can display a page and run page code. A server is a computer or process that handles requests. “Client” is a general name for the side making a request; a mobile app can also be a client."], ["The page and its data", "A website can send a page structure first, then request extra data. In our shop, the browser may first load the store layout and then ask for the book list. A backend is the code behind the visible screen that checks rules and fetches data."], ["Addresses and transport", "A URL identifies an address. DNS helps translate a human-readable host name into a network address. HTTPS carries web messages with encryption in transit when correctly configured. You will learn the details later. First remember the direction: ask, process, respond. <a href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Web_standards/How_the_web_works\" target=\"_blank\" rel=\"noopener\">Optional: MDN’s introduction to the web ↗<\/a>"]], "example": "When you open the shop, your browser asks for the page. The shop server responds with content. Your browser displays the result and may request book data next.", "tradeoff": "Putting all logic in the browser makes it easy for users to change it. Important permission and purchase checks need to happen on the server.", "prompt": "Explain to a friend what happens when you open an online shop. Use the words browser, server, and response.", "answer": "My browser sends a request across the network to the shop’s server. The server finds the requested information and sends a response. The browser displays the information.", "terms": [["Client", "A program that asks another program for work or information."], ["Server", "A program or computer that receives and handles requests."], ["Backend", "The server-side code and data behind a product."]], "quiz": [{"q": "Which part displays a website for the user?", "opts": ["The browser", "Only the database", "The DNS name"], "a": 0, "why": "The browser renders the page."}, {"q": "A response travels…", "opts": ["From server back to client", "Only from database to database", "Only inside a logo file"], "a": 0, "why": "The request asks; the response returns the outcome."}], "minutes": 20, "lab": "request", "stage": 0, "group": "01 · Start from zero"}, {"id": "request", "title": "Follow one request", "goal": "Trace a read from the user to storage and back.", "plain": "A request is a message asking for something. A response is the answer. Trace one complete journey before trying to design many journeys.", "analogy": "A librarian receives “find this book,” checks a catalog, and tells you its shelf. The catalog does not speak directly to the visitor.", "steps": ["The browser asks for the book list.", "The application reads saved book records.", "The application sends an answer back to the browser."], "sections": [["Reads and writes", "A read retrieves saved information, such as a book price. A write changes information, such as a new review. Separate them when explaining a design because they can have different speed and correctness needs."], ["Every step has an outcome", "A successful read can return a book list. An empty list can also be a successful response. A failed request might return an error because storage is unavailable. Always describe success and failure; a diagram alone cannot show the whole contract."], ["Trace one item", "Start with one request and name the information at every step. Then increase the number of requests. In the request lab, press “next step” to see the message move. The lab is a teaching sequence, not an actual network request."]], "example": "Browser asks “list books.” Shop code asks storage for book records. Storage returns records. Shop code formats the result and returns it to the browser.", "tradeoff": "Calling storage for every read is simple. If many people request the same information, those repeated calls can become unnecessary work.", "prompt": "Write four steps for looking up one book. Add what the user sees if the book does not exist.", "answer": "The browser asks for book 42; the application checks the request; storage looks up 42; the application returns details or a not-found response. The browser shows the details or a helpful message.", "terms": [["Request", "A message asking a service to do work."], ["Response", "The outcome returned to the caller."], ["Read / write", "Retrieve information / change information."]], "quiz": [{"q": "Looking at the price of a book is usually a…", "opts": ["Read", "Write", "Backup restore"], "a": 0, "why": "The saved data is being retrieved."}, {"q": "A complete request explanation includes…", "opts": ["Only the happy path", "Both success and a relevant failure", "Only technology names"], "a": 1, "why": "A design must explain what the user experiences when something fails."}], "minutes": 20, "lab": "request", "stage": 0, "group": "01 · Start from zero"}, {"id": "data", "title": "How applications remember things", "goal": "Understand records, storage, and a source of truth.", "plain": "A database is organized storage that helps applications save and find facts. Your bookshop needs saved data to remember books, customers, and orders.", "analogy": "A spreadsheet with one row per book is a useful first mental picture. A real database also provides rules, search, and ways to handle people editing at the same time.", "steps": ["Choose the facts you must remember.", "Give each thing an identifier.", "Decide which place owns the authoritative value."], "sections": [["Rows, fields, and identifiers", "A book record can have an ID, title, and price. A field is one property, like price. A row is one record. An ID lets you refer to a record even when its title changes. Use explicit currency and units when representing amounts."], ["Memory and durable storage", "A running program can keep information in memory. Memory is fast, but information may disappear when the program restarts. Durable storage is intended to retain data across the failures covered by its contract. A database configured to store data only in memory does not automatically provide that guarantee."], ["One authoritative value", "The source of truth is the place whose value the product treats as authoritative. Copies can improve speed, but they may be outdated. If the book’s price differs between a cached screen and the database, decide which value applies when checking out."]], "example": "books: ID 42, title “Ocean Stories,” price_minor 1299, currency USD. orders: ID 81, customer 5, book 42, agreed_price_minor 1299. The order records the price actually agreed at purchase.", "tradeoff": "A copy makes reads faster but creates a freshness question. Do not let an old display value silently decide a correctness-sensitive operation.", "prompt": "Draw a table with three books and three fields. Explain which fields can change and which ID you would keep.", "answer": "Use columns book_id, title, and price. Titles and prices can change. Keep book_id stable so saved reviews or orders still refer to the same book.", "terms": [["Record", "One saved item with several properties."], ["Database", "Organized data and operations for storing and retrieving it."], ["Source of truth", "The authoritative place for a particular fact."]], "quiz": [{"q": "Why use an ID rather than a book title as its reference?", "opts": ["A title may change or be shared", "IDs automatically secure data", "IDs eliminate storage"], "a": 0, "why": "Stable identity is separate from a mutable name."}, {"q": "A running process restarts. What data should you assume survives?", "opts": ["All temporary memory", "Data saved durably under the storage contract", "Every unsaved variable"], "a": 1, "why": "Temporary memory and durable storage have different failure behavior."}], "minutes": 20, "lab": null, "stage": 0, "group": "01 · Start from zero"}, {"id": "api", "title": "APIs explained simply", "goal": "Describe how software parts ask each other for work.", "plain": "An API is an agreed way for one program to use another program. It tells the caller what to send and what result to expect.", "analogy": "A restaurant menu is a contract: it says what you can order and what you receive. You do not need to know the kitchen’s internal arrangement.", "steps": ["Name the operation, such as list books or create an order.", "Define the inputs and successful output.", "Define permission checks and useful errors."], "sections": [["A small contract", "Our shop exposes “list books,” “look up a book,” and “place an order.” The contract needs the requested book ID, quantity, and the identified buyer where applicable. The caller should know what an invalid quantity or unavailable book means."], ["Web API basics", "HTTP is a protocol used for web requests. GET commonly retrieves a resource. POST commonly submits data to create something or trigger an operation. A status code tells the caller the outcome category: 200 for successful retrieval, 201 for successful creation, 404 for not found. The precise contract still needs documentation."], ["Structured information", "JSON is a text format for structured values. A response could be {\"id\":42,\"title\":\"Ocean Stories\"}. It is data, not a guarantee of trust. The server validates inputs and permissions even when the browser already checked them."]], "example": "GET /books/42 returns {id:42,title:\"Ocean Stories\"}. POST /orders receives a book ID and quantity, then returns a new order ID or a documented failure.", "tradeoff": "A small API is easier to learn. If it hides essential outcomes such as “payment pending,” callers may make unsafe assumptions.", "prompt": "Write a simple API contract for adding a review. List the inputs, one success result, and one error.", "answer": "POST /books/42/reviews receives rating and text from an authenticated user. It returns a review ID. Reject ratings outside the allowed range and reject a user who lacks permission.", "terms": [["API", "An agreed interface between software parts."], ["HTTP", "A protocol used to send web requests and responses."], ["JSON", "A text format for structured information."]], "quiz": [{"q": "What does an API contract describe?", "opts": ["Only the internal source code", "Inputs, outputs, and behavior", "Only the website colors"], "a": 1, "why": "Callers depend on the agreed behavior."}, {"q": "Why validate inputs on the server?", "opts": ["The caller can send data without your web form", "Only to slow down the service", "Because browsers cannot display text"], "a": 0, "why": "Client-side validation can be bypassed."}], "minutes": 20, "lab": null, "stage": 0, "group": "01 · Start from zero"}, {"id": "draw", "title": "Read and draw your first architecture", "goal": "Use clear boxes and labeled arrows.", "plain": "A useful diagram gives each box one responsibility and labels each connection with what it carries. Start with one user journey.", "analogy": "A map is useful because it shows places and routes. A collection of place names without routes cannot tell you how to travel.", "steps": ["Draw the user, application, and data store.", "Label requests and returned data.", "Speak the sequence from beginning to end."], "sections": [["Boxes are responsibilities", "Label a box “shop application” or “book database,” then explain its job. A box need not equal a separate computer. The same server may run both at first; the logical diagram describes jobs before deployment."], ["Arrows are interactions", "An arrow from the application to the database can mean “look up book by ID.” Say whether the caller waits for the result. Label the return path or explain it aloud. An unlabeled arrow is ambiguous: it might mean an API call, a message, or replicated data."], ["Make it reviewable", "Keep the first version small enough that another person can trace it. Add assumptions nearby: one region, small catalog, modest traffic. Mark a failure point, such as database unavailability. Later lessons add components only when the original path needs them."]], "example": "Browser → application: request book 42. Application → database: lookup 42. Database → application: saved record. Application → browser: book details.", "tradeoff": "A very detailed diagram can hide the main path. Keep an overview and separate deep-dive diagrams when detail grows.", "prompt": "Draw the book lookup in your notes with three boxes and labeled arrows. Explain which box owns the data.", "answer": "Browser → shop API → book database, with a response returning along the path. The database owns saved book facts; the browser only displays a returned copy.", "terms": [["Component", "A part of a design with a defined job."], ["Synchronous", "The caller waits for the result before continuing that path."], ["Data flow", "The information moving between components."]], "quiz": [{"q": "A labeled arrow should explain…", "opts": ["What information or operation crosses the connection", "Only its color", "The name of the interviewer"], "a": 0, "why": "Interactions are as important as components."}, {"q": "Does every diagram box require its own computer?", "opts": ["Yes, always", "No; responsibilities and deployment are different"], "a": 1, "why": "Logical components can initially share a machine."}], "minutes": 20, "lab": null, "stage": 0, "group": "01 · Start from zero"}, {"id": "requirements", "title": "Turn a user need into requirements", "goal": "Decide what matters before adding infrastructure.", "plain": "A requirement is something the product must do or a quality it must meet. Separate the feature from how well the feature must work.", "analogy": "For a delivery service, “deliver a parcel” is a feature. “Deliver within two days” is a quality target.", "steps": ["Pick two or three essential user actions.", "State quality targets in observable terms.", "Write what is outside this version."], "sections": [["Behavior first", "Our shop must list books, let a user place an order, and show order status. Recommendations and live chat can wait. Excluding a feature is a conscious boundary, not forgetting it."], ["Define quality", "“Fast” needs a measurement: how long, for which operation, measured where, at what traffic? “Reliable” also needs a definition: can we tolerate an occasional delayed confirmation, but never two charges for one purchase? Correctness can matter more than speed."], ["Assumptions are allowed", "You may not know traffic yet. Write a small assumption, such as 1,000 visitors per day, and ask how it changes the design if wrong. A designer makes assumptions visible and revises them when new evidence arrives."]], "example": "Version one: list books, create orders, show status. Assume one region and 1,000 visitors/day. Never show success before the order is recorded. Exclude recommendation ranking.", "tradeoff": "A stricter target can increase cost and coordination. Do not choose impressive numbers that no user or business requirement supports.", "prompt": "Write two features, two quality targets, and one exclusion for a local library app.", "answer": "Search catalog and reserve a book. Assume catalog responses within one second for ordinary traffic; do not allow two active reservations for the last copy. Exclude ebook streaming.", "terms": [["Functional requirement", "A behavior the product supports."], ["Quality target", "A measurable expectation such as speed or correctness."], ["Assumption", "A stated belief used while information is missing."]], "quiz": [{"q": "“Show a user their order history” is a…", "opts": ["Feature requirement", "Network partition", "Storage unit"], "a": 0, "why": "It describes behavior."}, {"q": "Which is clearer than “make it fast”?", "opts": ["Respond within a stated time for a defined operation and load", "Use more servers", "Buy the newest database"], "a": 0, "why": "A measurable target can be validated."}], "minutes": 20, "lab": null, "stage": 1, "group": "02 · Build a working product"}, {"title": "APIs, networks & load balancing", "group": "02 · Build a working product", "minutes": 35, "goal": "Trace a request and define reliable API contracts.", "sections": [["Trace the request", "A client resolves DNS, connects to a network endpoint, negotiates TLS for HTTPS, and sends an HTTP request. An edge proxy can enforce coarse policies. A load balancer selects a healthy service instance. The instance validates identity and authorization, performs work, and returns a response. Connection reuse avoids repeating some setup costs."], ["Design the contract", "Define verbs, paths, inputs, outputs, errors, and access rules. For link creation: POST /links with a URL and optional expiry returns an identifier. GET /{code} resolves it. For a feed, cursor pagination is usually more stable than an offset under concurrent inserts; use a deterministic ordering key with a tie-breaker. Bound request size and page size."], ["Balance without losing state", "Round-robin is simple; least-connections can help when request durations vary. Health checks must reflect ability to serve. Stateless application servers put durable state outside the process. Sticky sessions simplify some connection routing but make failover harder; chat connections still need a location registry or routing mechanism."], ["Retries and side effects", "A lost response leaves the client uncertain: the operation may have committed. For side-effecting APIs, accept an idempotency key scoped to a user and operation. Atomically store the request fingerprint and result with the effect, or use a recoverable state machine. Reusing a key with a different request should fail. Document key expiry and retry behavior."]], "example": "POST /orders with Idempotency-Key: k123 can return the same order after a timeout. A UNIQUE(user_id, key) constraint prevents concurrent requests from creating two records, but the transaction must also connect the key to the committed outcome.", "tradeoff": "Permanent redirects can be cached by clients and are hard to revoke. Temporary redirects allow more control but may increase requests to your service. Choose based on mutability and analytics needs.", "prompt": "Define create, read, and list APIs for a file-sharing service. Add authorization, one error, and a retry policy.", "answer": "POST /files initializes an authorized upload; GET /files/{id} returns metadata after an ACL check; GET /files?cursor=… returns a bounded page. Use an idempotency key for initialization. Expired upload URLs require a new authorized URL. Return 403 for forbidden access without leaking unnecessary metadata.", "quiz": [{"q": "A create request times out. Which statement is safest?", "opts": ["The server definitely did nothing", "It may have committed; retry with the same idempotency key", "Always retry with a new key"], "a": 1, "why": "Timeout is uncertainty, not proof of rollback."}, {"q": "Why use a cursor with a deterministic tie-breaker?", "opts": ["To avoid every database index", "To make pagination stable when timestamps collide", "To encrypt all records"], "a": 1, "why": "A timestamp alone can tie; a stable compound ordering avoids ambiguous page boundaries."}], "lab": null, "id": "legacy-2", "legacyIndex": 2, "plain": "An API must tell callers what to send, what they can access, and what to do when an outcome is uncertain.", "analogy": "An order receipt lets a customer ask about the same order after losing the original response.", "steps": ["Define a request and success response.", "Check permissions and validation errors.", "Make repeated side-effect requests safe."], "terms": [["Idempotency key", "A stable identifier used to recognize repeated requests."], ["Cursor", "A position used to fetch the next page."], ["TLS", "The security protocol underlying HTTPS transport encryption."]], "stage": 1}, {"id": "index", "title": "Find data quickly: keys and indexes", "goal": "Understand why organization changes lookup cost.", "plain": "An index is an extra organized structure that helps storage find records efficiently. It speeds some queries and adds work when data changes.", "analogy": "A book index sends you to pages about a topic without reading every page. Maintaining that index is extra work for the publisher.", "steps": ["Describe the lookup you need.", "Organize an index around that lookup.", "Account for storage and write cost."], "sections": [["A full scan", "Without a suitable access path, finding orders for one buyer may require examining many records. That is a scan. Scans can be fine for small data or when reading most records, but become wasteful for selective lookups in large tables."], ["Index the query", "If order history filters by customer and sorts by time, an index based on customer and time may help. The order of columns and exact query matter. An index on an unrelated field does not solve that lookup."], ["Do not index everything", "When an order is inserted, relevant indexes also change. More indexes use more disk and add write work. In a real database, inspect its query plan, which shows how it intends to retrieve data, and measure with representative records."]], "example": "For “last 20 orders by buyer 5,” use a stable order such as created_at plus order_id and consider an index beginning with buyer_id. Test the plan rather than assuming.", "tradeoff": "Read speed improves for supported queries, while inserts, updates, and storage become more expensive.", "prompt": "You need to look up a user by email. What would you index and what rule might you enforce?", "answer": "Consider an index on the normalized email used by the lookup. If the product permits one account per normalized email, enforce uniqueness at the database too, using a defined normalization policy.", "terms": [["Index", "An additional structure that helps locate or order records."], ["Scan", "Examining a set of records to find matches."], ["Query plan", "The database’s chosen steps for executing a query."]], "quiz": [{"q": "Adding an index is free for writes.", "opts": ["True", "False; the index must also be maintained"], "a": 1, "why": "It adds write and storage cost."}, {"q": "Choose an index using…", "opts": ["The important queries", "Every field automatically", "Only the screen layout"], "a": 0, "why": "The access pattern drives the structure."}], "minutes": 20, "lab": null, "stage": 1, "group": "02 · Build a working product"}, {"title": "Data models & transactions", "group": "02 · Build a working product", "minutes": 45, "goal": "Choose storage from access patterns and invariants.", "sections": [["Start with queries", "List the queries before the tables: lookup by ID, list by owner and time, search text, count events, or traverse relationships. Model a relational schema when joins, constraints, and transactions are central. Consider key-value or document storage when bounded key-based access dominates. “SQL cannot scale” and “NoSQL has no transactions” are poor shortcuts; capabilities depend on the actual system."], ["Indexes are not free", "A B-tree index helps selective lookups and ordered range scans. A composite index often depends on its leading columns and the predicate/order shape. Every maintained index costs storage and write work. Explain the query and expected selectivity rather than adding an index to every column. Inspect query plans in real systems."], ["Protect the invariant", "For inventory, the invariant may be stock ≥ 0. An atomic conditional update such as UPDATE inventory SET stock=stock-1 WHERE id=? AND stock>0 makes the check and decrement one database operation. A unique constraint can enforce one seat booking. A transaction groups related changes, but the isolation level still matters."], ["Isolation affects correctness", "In PostgreSQL Read Committed, each statement reads a snapshot taken when that statement begins; successive statements can see different committed data. Serializable execution may reject a transaction to preserve a serial ordering, so applications must retry the whole transaction on serialization failure. Isolation is different from cross-region consistency. <a href=\"https://www.postgresql.org/docs/18/transaction-iso.html\" target=\"_blank\" rel=\"noopener\">Read the PostgreSQL isolation documentation ↗<\/a>"]], "example": "For messages: messages(conversation_id, sequence, sender_id, body, created_at), indexed by (conversation_id, sequence). Fetch the next page using sequence > cursor. Keep delivery receipts separate if they change more often than message content.", "tradeoff": "Denormalization removes read-time joins but makes updates and repair harder. Store authoritative facts once, then maintain derived views with versioning and reconciliation.", "prompt": "Design the schema and invariant for two users racing to book the same seat. Explain how the loser is detected.", "answer": "Use a booking table with a UNIQUE(event_id, seat_id) constraint. Within a transaction create the reservation and record its status. One insert wins; the other receives a conflict. If holds expire, use an explicit state transition and atomic ownership check. Coordinate payment separately with idempotency and compensation.", "quiz": [{"q": "Reading stock, then decrementing in a separate unprotected step risks…", "opts": ["Overselling under concurrent requests", "Automatic serializable behavior", "Only extra disk usage"], "a": 0, "why": "Two readers may both see one item. The invariant requires an atomic operation or suitable transaction/locking."}, {"q": "A useful first input to storage choice is…", "opts": ["The access patterns and correctness requirements", "The most fashionable database", "The number of diagram boxes"], "a": 0, "why": "Storage is a consequence of queries and invariants, not a starting brand choice."}], "lab": null, "id": "legacy-3", "legacyIndex": 3, "plain": "Choose storage by the questions you need to answer and the rules that must always hold. A transaction groups changes, but its concurrency rules matter too.", "analogy": "A shop must not sell the last copy to two buyers who arrive together.", "steps": ["List the reads and writes.", "Choose fields, identifiers, and indexes.", "Enforce critical rules atomically."], "terms": [["Transaction", "A group of operations committed under a database’s guarantees."], ["Atomic", "An operation or group treated as an indivisible outcome at its defined boundary."], ["Isolation", "Rules about what concurrent transactions may observe."]], "stage": 1}, {"id": "security", "title": "Identity, permissions, and safe boundaries", "goal": "Separate who a user is from what they may do.", "plain": "Authentication identifies the caller. Authorization checks whether that caller may perform the requested action on a particular object.", "analogy": "A visitor badge identifies you at an office. It does not automatically let you enter the finance room.", "steps": ["Identify the caller reliably.", "Check permission for the specific action and object.", "Protect secrets and reject untrusted inputs."], "sections": [["Check the object", "A signed-in user may see their own orders, not every order. When someone asks for order 81, the server checks ownership or another permitted role. Hiding a link in the browser is not a permission check."], ["Treat boundaries as untrusted", "Inputs can be malformed or intentionally harmful. Bound lengths and sizes, validate types, and use safe database operations such as parameterized queries. Do not trust an account ID merely because it appears in a request field."], ["Protect information", "Use correctly configured encryption in transit, control access to stored data, and avoid placing secrets in browser code or logs. Collect only needed personal data, define retention, and think through who may access backups and operational tools."]], "example": "GET /orders/81 first verifies the user’s identity, then checks access to order 81. Changing the URL to /orders/82 must not reveal someone else’s order.", "tradeoff": "Permission checks add work and complexity, but skipping them creates a direct data exposure. Design convenient access within explicit rules.", "prompt": "Explain why logging in is insufficient permission to download every user’s file.", "answer": "Login proves identity. The server still needs to check that the identified user owns the file, has a current sharing grant, or has an authorized role.", "terms": [["Authentication", "Establish who is calling."], ["Authorization", "Check what that caller is permitted to do."], ["Secret", "Sensitive authentication material such as a credential or token."]], "quiz": [{"q": "A signed-in user changes an order ID. What check matters?", "opts": ["Permission to view that specific order", "Only login success", "Only the ID’s length"], "a": 0, "why": "Object-level authorization prevents access across accounts."}, {"q": "Can hiding a button enforce permission?", "opts": ["Yes", "No; callers can submit requests directly"], "a": 1, "why": "The server must enforce the rule."}], "minutes": 20, "lab": null, "stage": 1, "group": "02 · Build a working product"}, {"id": "speed", "title": "Speed, traffic, and bottlenecks", "goal": "Distinguish waiting time from the amount of work.", "plain": "Latency is how long one request takes. Throughput is how many requests finish per second. A bottleneck is the part limiting the overall flow.", "analogy": "One cashier takes two minutes per customer: that is waiting/processing time. Several cashiers can complete more customers per hour, even if each checkout takes the same time.", "steps": ["Measure time for one request.", "Measure completed work over a period.", "Find the limiting part before changing it."], "sections": [["Use familiar units", "1,000 milliseconds equal one second. QPS means queries or requests per second; be explicit about what is counted. If ten requests arrive each second but only eight finish, unfinished work can accumulate."], ["Average is not everyone", "Some requests are much slower than most. A percentile describes a distribution: p99 is a value at or below which 99% of measured request latencies fall. The remaining tail can still be much slower. Measure a clear operation and time window."], ["Follow the waiting", "Our shop spends 5 ms checking input and 200 ms reading storage. Optimizing input checks saves little compared with improving the read. Extra application servers may not help if every request still waits on one saturated database."]], "example": "At 100 requests/sec with 0.1 seconds average end-to-end time in a stable system, roughly ten requests are in flight on average. This says nothing by itself about burst behavior.", "tradeoff": "More concurrency can improve throughput until a shared resource saturates; beyond that it can increase waiting and errors.", "prompt": "A request takes 10 ms in app code and 400 ms in storage. Where would you investigate first, and what would you measure?", "answer": "Investigate storage calls, query plans, I/O, and connection waiting. Measure the slow path and its load before adding capacity. Confirm that the observation is representative.", "terms": [["Latency", "Time taken for a defined operation."], ["Throughput", "Completed work per unit time."], ["Bottleneck", "The resource currently limiting the flow."]], "quiz": [{"q": "Completing 200 requests each second measures…", "opts": ["Throughput", "Only latency", "Retention"], "a": 0, "why": "This is work per unit time."}, {"q": "If the database is saturated, more app servers may…", "opts": ["Send even more work to the same bottleneck", "Always repair it", "Delete the need for a database"], "a": 0, "why": "Scale the constrained path, not just the easiest component."}], "minutes": 20, "lab": null, "stage": 2, "group": "03 · Handle more traffic"}, {"title": "Estimate scale & budgets", "group": "03 · Handle more traffic", "minutes": 40, "goal": "Translate traffic into capacity, storage, and bandwidth.", "sections": [["Use units every time", "Average QPS = daily users × actions per user ÷ 86,400. Peak QPS = average QPS × an assumed peak multiplier. Distinguish requests, records, bytes, and seconds. Write traffic and read/write ratios before calculating. Round to one or two significant digits; the value is in the order of magnitude, not false precision."], ["Storage and bandwidth", "Raw storage = writes/day × bytes/record × retention days. Physical storage adds replication, indexes, metadata, compaction headroom, and backups. Raw egress bandwidth = reads/sec × bytes/response; multiply by 8 for bits/sec. Media often dominates bandwidth while metadata dominates database request count. Use decimal GB (10⁹ bytes) here; GiB uses 2³⁰ bytes."], ["Latency and concurrency", "For a stable system, Little’s law gives average in-flight work L = arrival rate λ × average time W. At 2,000 requests/sec and 50 ms average service time, about 100 requests are in flight. This does not estimate p99 concurrency during bursts. Sequential latency budgets add; parallel branches are bounded by the slowest required branch plus coordination."], ["Capacity is measured", "If a measured instance handles 500 QPS at the target latency, planning for 60% utilization gives 300 QPS per instance. Divide peak traffic by that value and round up. Account separately for losing an instance or zone. Benchmark representative workloads: CPU, connections, storage I/O, and skew can change the limit."]], "example": "10M DAU × 20 reads/day = 200M reads/day ≈ 2,315 average QPS. At 10× peak, plan for ≈23,150 QPS. If 1M records/day are 500 bytes each, 365 days stores 182.5 GB raw, or 547.5 GB with three copies before other overhead.", "tradeoff": "Overprovisioning reduces overload risk but raises cost. Autoscaling needs warm-up time and cannot instantly repair a hot database partition.", "prompt": "Estimate 2M DAU, 30 reads/day, 2 writes/day, 1 KB/record, 90-day retention, and a 5× read peak. Explain one missing overhead.", "answer": "Reads: 60M/day → about 694 average and 3,472 peak QPS. Writes: 4M/day → about 46 average QPS. Raw storage: 360 GB decimal. Add replica copies and index/storage overhead explicitly.", "quiz": [{"q": "At 1,000 requests/sec and 0.2 seconds average time, stable average in-flight requests are…", "opts": ["5", "200", "5,000"], "a": 1, "why": "L = 1,000 × 0.2 = 200. Keep time in seconds."}, {"q": "A three-replica database stores 100 GB of raw data. What can you conclude?", "opts": ["Total disk is exactly 100 GB", "Data copies use about 300 GB before other overhead", "It can serve any workload"], "a": 1, "why": "Indexes, logs, backups, and free-space headroom are additional."}], "lab": "capacity", "id": "legacy-1", "legacyIndex": 1, "plain": "Estimates turn everyday usage into requests, bytes, and resources. Start with one calculation and keep its units visible.", "analogy": "Count meals per day before deciding how many cooks and how much food a café needs.", "steps": ["Multiply users by actions per user.", "Convert daily actions into actions per second.", "Add peak and storage assumptions separately."], "terms": [["QPS", "Requests or queries per second; define what you count."], ["Retention", "How long records are kept."], ["GB", "Here, one billion bytes; a decimal storage unit."]], "stage": 2}, {"id": "balance", "title": "Grow from one server to several", "goal": "Understand vertical scaling, horizontal scaling, and routing.", "plain": "You can give one machine more resources, or run more machines. When several servers can do the same job, a load balancer routes requests between them.", "analogy": "A larger checkout counter is vertical scaling. Opening more checkout counters is horizontal scaling. A queue marshal sends customers to an available counter.", "steps": ["Check whether one larger machine is enough.", "If adding servers, move shared state somewhere they can all use safely.", "Route only to servers able to handle the request."], "sections": [["Two ways to grow", "Vertical scaling increases resources such as CPU or memory on one machine. It is often simpler but has machine limits. Horizontal scaling adds machines. It can help capacity and failure isolation, but only if the workload can be divided."], ["Avoid hidden local state", "If one app server stores the only copy of a shopping cart in its own memory, another server cannot read it. Use shared durable storage or an explicit state-routing design. “Stateless application” means critical session/business state is not owned only by that process."], ["Health and spare room", "The router should avoid unhealthy instances. If two servers are needed just to meet normal demand, losing one may overload the other. Decide how much failure capacity to reserve and how new instances become ready before receiving traffic."]], "example": "Our shop adds a second application server and a load balancer. Both app servers use the same database. Losing one app server can preserve service if the remaining capacity is sufficient.", "tradeoff": "More application servers add capacity on the app tier; they do not automatically add database capacity.", "prompt": "Draw two app servers behind a load balancer. Where does the cart live so either server can serve the same user?", "answer": "Keep the authoritative cart in shared storage with an account or session ID. Each app server retrieves it. Define updates and concurrent-edit behavior rather than copying mutable carts independently.", "terms": [["Vertical scaling", "Increase resources on a machine."], ["Horizontal scaling", "Add machines or instances."], ["Load balancer", "Routes incoming requests across eligible instances."]], "quiz": [{"q": "Adding a second identical application server is…", "opts": ["Horizontal scaling", "Vertical scaling", "Backup restoration"], "a": 0, "why": "You are adding instances."}, {"q": "Why keep critical cart data outside one app process?", "opts": ["A different instance or restart must still find it", "To make every request public", "To remove all database work"], "a": 0, "why": "The state must survive routing and instance failures."}], "minutes": 20, "lab": null, "stage": 2, "group": "03 · Handle more traffic"}, {"title": "Caching & content delivery", "group": "03 · Handle more traffic", "minutes": 40, "goal": "Reduce expensive reads without hiding correctness problems.", "sections": [["Cache-aside, step by step", "The application checks the cache. On a miss it reads the source of truth, returns the data, and fills the cache with an expiry. Repeated reads avoid database work. Cache keys should include relevant tenant, object, and representation/version dimensions. Never mix private responses between users."], ["Choose a staleness budget", "TTL bounds freshness only under the assumptions of your fill and refresh path. Invalidate or update entries after writes, but races can refill stale values. A reader can read old data, a writer can invalidate, and the reader can then cache the old value. Versions, carefully ordered updates, short TTLs, or avoiding caching critical reads can mitigate this."], ["Handle misses together", "When a popular key expires, thousands of requests can hit the database. Request coalescing lets one worker fill while others wait. TTL jitter spreads expirations across keys. Stale-while-revalidate may serve old data during refresh where the product tolerates it. Negative caching helps repeated missing-key requests but should have a short TTL."], ["Put large immutable bytes near users", "A CDN caches content at edge locations. Versioned object URLs make immutable media easy to cache for longer periods. Keep authorization and cache behavior explicit for private objects. A CDN does not replace your metadata database or automatically solve private access, revocation, or cache key leakage."]], "example": "At 10,000 reads/sec and 90% hit rate, the source sees roughly 1,000 reads/sec in a simplified steady-state model. If the cache fails, it could see all 10,000. Size fallback capacity or shed load; a cache is a dependency.", "tradeoff": "Long TTL improves hit rate and reduces source load but tolerates more stale data. An account balance often needs authoritative reads; an avatar can tolerate delayed refresh.", "prompt": "A celebrity profile cache expires during a traffic spike. Describe the miss path, protection against stampede, and fallback.", "answer": "Coalesce requests per key, cap concurrent source reads, and use a short timeout. Serve a stale public profile during refresh if allowed, with bounded staleness and metrics. Add jitter to expiry across keys. If no safe stale copy exists, fail gracefully or rate-limit rather than overwhelm the database.", "quiz": [{"q": "Increasing the cache hit rate from 80% to 95% at 10,000 QPS changes simplified source traffic to…", "opts": ["9,500 QPS", "500 QPS", "2,000 QPS"], "a": 1, "why": "Source QPS = QPS × (1 - hit rate) = 500."}, {"q": "Deleting a cache key after a database write always prevents stale refill.", "opts": ["True", "False; a concurrent reader can refill old data", "True if the cache uses RAM"], "a": 1, "why": "Invalidation races require explicit handling when freshness matters."}], "lab": "cache", "id": "legacy-4", "legacyIndex": 4, "plain": "A cache saves a reusable copy so you can avoid repeating an expensive lookup. It helps speed but introduces old-data and failure questions.", "analogy": "Keep popular books near the desk rather than walking to a shelf for every request.", "steps": ["Check the fast copy first.", "On a miss, ask the authoritative source.", "Choose expiry and safe fallback behavior."], "terms": [["Cache hit", "The needed reusable item is present."], ["TTL", "Time to live: the configured lifetime of an entry."], ["CDN", "A content delivery network that can serve bytes near users."]], "stage": 2}, {"title": "Partitioning & hot keys", "group": "03 · Handle more traffic", "minutes": 40, "goal": "Scale data ownership and handle uneven load.", "sections": [["Split ownership", "Sharding partitions records across storage owners. Hash partitioning tends to distribute keys, while range partitioning helps ordered scans and can suffer concentrated writes. Choose a shard key from access patterns: conversation_id groups chat history; tenant_id isolates customer data but a giant tenant may dominate one shard."], ["Routing and movement", "A mapping layer or partition map tells services where data lives. Consistent hashing reduces key movement when membership changes compared with a simple modulo scheme. Virtual nodes help balance ownership, but uniform ownership does not imply uniform traffic. Migration must handle in-flight reads and writes, stale routers, and verification before removing the old copy."], ["Hot keys need a separate strategy", "A popular object can overload a single partition even when every shard has the same record count. Replicate cached reads, coalesce requests, or isolate high-traffic tenants. A high-write counter can be split into partial counters and aggregated, at the cost of immediate exact reads. Salting keys spreads writes but makes reads more complex."], ["Cross-shard work is expensive", "A transaction or query spanning shards needs coordination or application-managed work. Keep related invariants together when possible. Secondary indexes across shards can introduce scatter-gather reads or a separate index service. Monitor per-shard QPS, tail latency, size, and skew; cluster averages can conceal a failing partition."]], "example": "A timestamp-only shard key for a log service sends all current writes to the newest range. Partition by a time bucket plus a hash bucket, then merge a bounded set of buckets for time-range queries.", "tradeoff": "More shards add capacity and failure isolation but increase routing, rebalance, and cross-shard complexity. Avoid sharding before simpler storage and indexing changes are insufficient.", "prompt": "One tenant produces 40% of writes. Why is adding more evenly hashed tenants insufficient, and what would you change?", "answer": "The hot tenant still maps to one shard. Give that tenant dedicated capacity or subdivide by tenant plus an entity/hash bucket. Identify which queries now need fan-out and which transactions need to remain colocated.", "quiz": [{"q": "Consistent hashing automatically eliminates celebrity hot keys.", "opts": ["True", "False; key ownership balance is different from traffic balance"], "a": 1, "why": "One popular key still has concentrated demand unless its access path is redesigned."}, {"q": "A time-based range partition receiving all new writes is vulnerable to…", "opts": ["A hot newest partition", "Too many cache hits", "No need for routing"], "a": 0, "why": "The shard key concentrates current traffic."}], "lab": null, "id": "legacy-6", "legacyIndex": 6, "plain": "Sharding gives different storage owners different subsets of records. It only helps if the busiest work is distributed too.", "analogy": "Give librarians separate sections; one hugely popular section can still overload its assigned librarian.", "steps": ["Choose a key that decides ownership.", "Check which queries stay together.", "Plan hot-key handling and data movement."], "terms": [["Shard", "A data subset with an assigned storage owner."], ["Hot key", "A key receiving disproportionately high traffic."], ["Consistent hashing", "An ownership scheme that reduces key movement for membership changes."]], "stage": 2}, {"id": "copies", "title": "Copies of data and stale reads", "goal": "Understand replication before studying consistency models.", "plain": "Replication keeps copies of data on multiple storage nodes. Copies can help survive failures and serve reads, but may not all have the newest value immediately.", "analogy": "Two shop branches keep price lists. When headquarters changes a price, one branch may receive the update a little later.", "steps": ["Choose who accepts the authoritative update.", "Decide when other copies receive it.", "Decide which copy a read can safely use."], "sections": [["Leader and follower", "One common design has a leader that orders writes and followers that copy them. A follower is not just a periodic backup: it is an active replica. The details vary between storage systems."], ["Asynchronous updates", "If the leader responds before all followers receive the change, a follower read can return the older price. This delay is replication lag. That may be fine for view counts but confusing immediately after editing your profile."], ["Wait or tolerate delay", "You can wait for more copies before acknowledging a write, route some reads to the leader, or accept a freshness delay. Each choice affects speed or behavior during failure. Later, the consistency lesson names the guarantees more precisely."]], "example": "A buyer updates their address, then reads a delayed copy and sees the old address. Route that session to a suitable authoritative path or wait for a known update to appear.", "tradeoff": "Waiting for more copies can protect durability under specified failures, but can slow or prevent acknowledgments when those copies are unavailable.", "prompt": "Would an old like count and an old shipping address have the same impact? Explain a different read policy for each.", "answer": "A slightly old like count may be acceptable. Before shipping an order, use the authoritative agreed address rather than a delayed display copy. Name the required guarantee on that path.", "terms": [["Replication", "Maintain copies of data across nodes."], ["Replica", "One copy maintained by a replication protocol."], ["Replication lag", "Delay before a replica reflects an update."]], "quiz": [{"q": "Does having a replica mean it always has the latest value?", "opts": ["Yes", "No; updates can arrive later"], "a": 1, "why": "That depends on the replication and read protocol."}, {"q": "Choose freshness using…", "opts": ["The harm a stale value could cause", "Only the number of machines", "The color of the diagram"], "a": 0, "why": "Correctness needs differ by operation."}], "minutes": 20, "lab": null, "stage": 3, "group": "04 · Coordinate distributed work"}, {"title": "Replication, consistency & CAP", "group": "04 · Coordinate distributed work", "minutes": 50, "goal": "Explain stale reads, partitions, and the limits of quorums.", "sections": [["Replicas serve different goals", "Copies of data can improve read capacity, availability, and disaster recovery. A leader often orders writes and asynchronously sends them to followers. Follower reads can be stale. Synchronous acknowledgment from replicas increases write latency and may reduce write availability during failures. Replication is not a backup: accidental deletion can be replicated too."], ["Name the guarantee", "Eventual consistency means replicas converge when updates stop and communication resumes under the system’s assumptions. Read-your-writes is a session guarantee. Linearizability makes operations appear atomic in real-time order. Serializable transactions behave like some serial ordering, which alone does not require real-time ordering. Match the guarantee to the operation, not the entire product."], ["CAP applies during partitions", "When network partitions separate nodes, a distributed service cannot guarantee both linearizable consistency and availability for every request to a non-failing node in the formal model. A correctness-sensitive operation may reject or delay requests on an isolated side; another may accept work with reconciliation. CAP is not a general instruction to “choose any two” at all times. <a href=\"https://www.cs.princeton.edu/courses/archive/spr22/cos418/papers/cap.pdf\" target=\"_blank\" rel=\"noopener\">Gilbert & Lynch’s formal treatment ↗<\/a>"], ["Quorum overlap has conditions", "With N replicas, write acknowledgments W and read responses R, R+W>N guarantees set overlap when they refer to the same replica set. It does not alone ensure linearizability. Concurrent writes, version selection, membership changes, sloppy quorums, and whether acknowledged replicas are durably updated matter. Explain the protocol and conflict rules."]], "example": "A user posts a comment and immediately reads a follower that has not caught up. Route that session to the leader, use a commit token and wait for replica progress, or render the submitted comment locally while synchronization completes.", "tradeoff": "Stronger guarantees can add coordination latency and reduce availability during some failures. Allow stale counts while protecting unique ownership or financial invariants separately.", "prompt": "For a shopping cart and final stock reservation, choose the behavior during a partition and explain why it differs.", "answer": "Cart edits may be accepted with a documented conflict strategy because reconciliation is tolerable. Final stock reservation should use an authoritative atomic path; an isolated side may reject or delay reservations to avoid overselling. State how the user learns whether a timed-out reservation committed.", "quiz": [{"q": "R=2, W=2, N=3 proves…", "opts": ["All operations are linearizable in any system", "Read and write sets overlap for the same fixed replica set", "Network failures are impossible"], "a": 1, "why": "Overlap is a necessary ingredient in some protocols, not a complete consistency proof."}, {"q": "A stale follower read after a successful write is primarily…", "opts": ["A replication lag/session consistency issue", "A DNS naming issue", "Proof that transactions do not exist"], "a": 0, "why": "Read-your-writes can be restored with routing, tokens, or other session-aware mechanisms."}], "lab": "quorum", "id": "legacy-5", "legacyIndex": 5, "plain": "When several nodes keep data, choose how fresh a read must be and what happens when nodes cannot communicate.", "analogy": "Two shop branches cannot always confirm the same latest stock while their link is broken.", "steps": ["Identify which operations tolerate old data.", "Name the guarantee needed for critical actions.", "Explain the behavior during communication failure."], "terms": [["Linearizability", "Operations appear atomic in an order respecting real-time completion."], ["Network partition", "Nodes are separated by communication failure."], ["Eventual consistency", "Copies converge under the system’s stated assumptions when updates stop and communication resumes."]], "stage": 3}, {"title": "Queues, streams & asynchronous work", "group": "04 · Coordinate distributed work", "minutes": 45, "goal": "Decouple workflows while making duplicate processing safe.", "sections": [["Move work off the request path", "A queue lets an API accept work and workers process it independently. It absorbs finite bursts and enables retries. Return “accepted” separately from “completed,” with a job status API when useful. A queue cannot solve sustained undercapacity; if arrival rate exceeds processing rate, backlog keeps growing."], ["Delivery and acknowledgment", "At-least-once delivery can duplicate work: a worker may finish a side effect then fail before acknowledgment. Acknowledge only after the durable outcome, and make processing idempotent. At-most-once can lose work. Claims of exactly-once depend on the boundary: one broker transaction does not automatically make an external email or payment happen once."], ["Order only what needs ordering", "Partitioning a stream by entity can preserve order within a partition under the broker’s protocol, not global order. Sequence numbers detect gaps and duplicates. Consumer groups distribute partitions among workers; adding workers beyond the partition count may not increase useful parallelism. Poison messages need bounded retries and a dead-letter path with safe replay."], ["Avoid the dual-write gap", "Writing database state and publishing an event separately can fail in between. A transactional outbox commits the business change and an outbox row together. A relay later publishes the row and can publish it again, so consumers deduplicate. Track outbox age and relay health; the pattern improves reliable publication rather than eliminating every duplicate."]], "example": "Arrival is 120 jobs/sec; four workers process 25 jobs/sec each. Backlog grows by 20/sec or 1,200/minute. Five workers only slightly exceed arrival; six give more recovery headroom, assuming independent workers and no downstream bottleneck.", "tradeoff": "Async work shortens the interactive request but introduces eventual completion, queue lag, and user-visible status. Some operations must commit before returning success.", "prompt": "A worker charges a card, crashes, and receives the job again. Explain a safe design and a reconciliation path.", "answer": "Use a durable payment attempt ID as the provider idempotency key. Persist the outcome and reconcile ambiguous attempts using provider status before retrying. Commit internal state and outbox events atomically. Deduplicate consumers and do not treat message acknowledgment as proof that a payment never happened.", "quiz": [{"q": "A queue receives 200 jobs/sec while workers finish 150/sec.", "opts": ["Backlog stays constant", "Backlog grows by about 50/sec", "Queues automatically add workers"], "a": 1, "why": "A queue buffers the mismatch; it does not create processing capacity."}, {"q": "An outbox primarily solves…", "opts": ["The gap between committing data and publishing an event", "Every external side effect exactly once", "All hot partitions"], "a": 0, "why": "The relay still needs retry handling and downstream deduplication."}], "lab": "queue", "id": "legacy-7", "legacyIndex": 7, "plain": "A queue lets one part hand work to another part for later processing. Jobs can be delayed or delivered more than once.", "analogy": "A ticket printer lets a cashier accept orders while cooks prepare them at their own pace.", "steps": ["Record what has been accepted.", "Process it with durable outcomes and safe retries.", "Watch delay and define completion status."], "terms": [["Queue", "A buffer of work waiting to be handled."], ["Acknowledgment", "A signal that processing or receipt reached a defined boundary."], ["Outbox", "Durable event rows committed with a related business change."]], "stage": 3}, {"id": "consensus", "title": "Who is in charge? Leadership and consensus", "goal": "Understand why replicated state needs an agreement protocol.", "plain": "Consensus lets cooperating nodes agree on a sequence of decisions under a stated failure model. It is useful when they need one coherent authority for shared state.", "analogy": "A team keeps one approved ledger. A coordinator proposes changes, but the agreed rules prevent two conflicting versions from both becoming the official ledger.", "steps": ["Know which authority orders updates.", "Understand how a new authority is chosen after failure.", "Use a proven protocol instead of inventing a “majority” shortcut."], "sections": [["The split-leader risk", "A slow node is not necessarily dead. If two nodes both believe they may independently write authoritative state, the product can accept conflicting outcomes. Ownership needs a protocol and, when controlling external resources, enforcement that rejects stale owners."], ["A Raft overview", "Raft divides the problem into leader election, log replication, and safety rules. A leader proposes entries and replicates them under the protocol. Elections and commitment need more than counting arbitrary responses: terms, log state, and safety constraints matter. A minority separated from the voting majority cannot continue committing new decisions under the usual model. <a href=\"https://raft.github.io/\" target=\"_blank\" rel=\"noopener\">Study Raft from its authors’ site ↗<\/a>"], ["Use the boundary correctly", "A consensus-backed metadata service can decide which worker owns a task. It does not magically make an external payment exactly once. The target resource may need a fencing token: an increasing ownership generation that lets it reject work from a stale owner. Use tested implementations and know the failure contract."]], "example": "An ordering service for one conversation elects an authority under a proven protocol. After failover, the old authority must not continue producing accepted conflicting messages.", "tradeoff": "Agreement requires coordination and a reachable quorum. It adds latency and can limit progress during some partitions.", "prompt": "Why is “the old leader did not reply, so any node can become leader” unsafe?", "answer": "The old leader might be delayed or isolated rather than stopped. Several nodes might promote themselves. A defined election and safety protocol, plus enforcement of ownership where needed, prevents conflicting authority.", "terms": [["Consensus", "Agreement on decisions under a defined protocol and failure model."], ["Quorum", "The response set required by a protocol."], ["Fencing token", "An ownership generation checked by the target to reject stale owners."]], "quiz": [{"q": "An unresponsive leader is definitely stopped.", "opts": ["True", "False; it might be slow or isolated"], "a": 1, "why": "Failure detection is uncertain."}, {"q": "Counting a majority of arbitrary responses is a complete consensus protocol.", "opts": ["True", "False; election and safety rules also matter"], "a": 1, "why": "Agreement requires the full protocol, including state and ordering constraints."}], "minutes": 30, "lab": null, "stage": 3, "group": "04 · Coordinate distributed work"}, {"id": "search", "title": "Search, derived views, and event data", "goal": "Separate authoritative records from specialized read structures.", "plain": "One data store need not answer every kind of query. You can build a specialized view from authoritative data, then accept and manage the delay in that view.", "analogy": "A library keeps its official catalog and a separate subject index. The index helps discovery; the catalog still determines the current record.", "steps": ["Keep authoritative data clear.", "Update the specialized view through a reliable path.", "Plan rebuilds and explain freshness to users."], "sections": [["Find text efficiently", "An inverted index maps words to matching documents. A search service can use it to answer “books about oceans” without scanning every description. Ranking decides the order. This is different from a simple lookup by book ID."], ["Derived means rebuildable", "A search index, analytics count, or feed reference store can be a derived view. It is computed from other facts. If it is damaged, a recovery plan should rebuild it from authoritative records or replayable events. Include deletions and permissions, not just inserts."], ["User-facing freshness", "If indexing is asynchronous, a new book may not appear in search immediately. Monitor the oldest pending update and expose or tolerate the delay. Recheck sensitive permission or availability decisions on the authoritative path before acting."]], "example": "Publishing a book stores its authoritative record and a reliable event. A worker updates search. Browsing by ID works immediately; search results may take a short agreed time to reflect the new book.", "tradeoff": "Specialized indexes improve read performance but add freshness, replay, and maintenance work.", "prompt": "A deleted private document remains in a search index. What must the search and read paths do?", "answer": "Propagate deletion and permission changes, monitor their lag, and avoid returning unauthorized data while stale entries remain. Check current access before revealing sensitive content. Rebuild derived indexes with the same rules.", "terms": [["Derived view", "A read structure computed from authoritative data."], ["Inverted index", "Maps terms to documents that contain them."], ["Replay", "Process saved events again to rebuild or repair state."]], "quiz": [{"q": "A derived view should have…", "opts": ["A rebuild or repair plan", "No relationship to its source", "Permission to expose all data"], "a": 0, "why": "Derived state can lag or become inconsistent."}, {"q": "Search indexing delay means…", "opts": ["A new item may be absent from search briefly", "The authoritative write necessarily failed", "The item is automatically public"], "a": 0, "why": "Creation and indexing can have different completion times."}], "minutes": 20, "lab": null, "stage": 3, "group": "04 · Coordinate distributed work"}, {"title": "Resilience & rate limiting", "group": "05 · Operate reliably", "minutes": 45, "goal": "Contain failures and keep overload from cascading.", "sections": [["Every remote call needs a budget", "Set timeouts inside an end-to-end deadline. A timeout does not prove that a side effect failed. Bound retries and use backoff with jitter so clients do not synchronize. Retrying at many layers can multiply load; establish a retry owner and budget. <a href=\"https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/\" target=\"_blank\" rel=\"noopener\">AWS: timeouts, retries, and jitter ↗<\/a>"], ["Isolate failure", "A circuit breaker stops many calls to a dependency after observed failures, then probes recovery. Bulkheads cap resources per dependency or tenant. Bound queues and concurrency to prevent memory and connection exhaustion. Degrade optional features before critical paths; a recommendation outage need not prevent checkout."], ["Rate limit intentionally", "A token bucket holds up to B tokens and refills at r tokens/sec. Each accepted request consumes a token, allowing bursts up to capacity and a sustained rate near r. A fixed window has a boundary burst problem. Sliding windows track recent work more precisely but may use more state. Specify the identity, endpoint cost, quota, and response when rejected."], ["Distributed enforcement", "A shared atomic store can enforce a global quota but adds network latency and a dependency. Local buckets are fast but aggregate allowance grows with instances unless budgets are divided. Decide whether to fail open or closed when the limiter fails: strict protection may sacrifice access; permissive behavior may overload a service. Authentication and abuse detection remain separate."]], "example": "Five service layers making three total attempts each can produce 3⁵ = 243 attempts at the deepest dependency in a worst-case retry tree. A bounded retry policy at one layer is easier to reason about.", "tradeoff": "Strict global limits require coordination. Approximate local limits are cheaper and more available, but may exceed a promised quota during scaling or partitions.", "prompt": "Design an API limit of 100 requests/minute with bursts of 20. Describe identity, algorithm, atomic state update, and outage behavior.", "answer": "Use a per-account token bucket with capacity 20 and refill 100/60 tokens/sec. Atomically compute min(capacity, tokens + elapsed×refill), then consume if at least one token remains. Return 429 and a retry hint. Decide explicitly whether limiter unavailability fails closed for expensive writes or uses conservative local fallback.", "quiz": [{"q": "A token bucket with capacity 20 and refill 2/sec permits…", "opts": ["Only 2 requests ever", "An initial burst of 20, then a sustained rate near 2/sec", "An unlimited instantaneous burst"], "a": 1, "why": "Capacity governs burst allowance; refill governs sustained allowance."}, {"q": "Retries during overload can…", "opts": ["Increase pressure and delay recovery", "Guarantee more capacity", "Make timeouts unnecessary"], "a": 0, "why": "Budget retries and inspect failure causes instead of repeating every request."}], "lab": "bucket", "id": "legacy-8", "legacyIndex": 8, "plain": "A slow dependency can hold resources and cause more failures. Limit waiting, repeated attempts, and incoming work.", "analogy": "A café stops accepting unlimited orders when its kitchen cannot keep up.", "steps": ["Give remote calls a waiting budget.", "Retry only safely and within a limit.", "Bound work so one failing path cannot exhaust everything."], "terms": [["Timeout", "The maximum wait for a defined operation."], ["Backoff", "Increasing delay before repeated attempts."], ["Rate limit", "An enforced allowance of work for a defined identity and scope."]], "stage": 4}, {"title": "Observability, security & operations", "group": "05 · Operate reliably", "minutes": 40, "goal": "Show how a design is run, protected, and repaired.", "sections": [["Measure the user experience", "Define an SLI such as successful authorized feed reads / all eligible feed reads. An SLO is its target over a stated window. Track latency percentiles, errors, traffic, saturation, and domain metrics such as message delivery delay. Logs explain events; traces show a request across services. Use correlation IDs and avoid secrets or sensitive payloads in telemetry."], ["Budget failure", "For a time-based 99.9% availability objective over a 30-day month, the downtime budget is about 43.2 minutes. Request-based availability has a request budget instead. Alert on actionable burn of the error budget and saturation, not every isolated error. p99 means 99% of measured requests were at or below that latency; an average can hide a painful tail."], ["Protect each boundary", "Authenticate who is calling; authorize what they can access. Check object-level permissions on every relevant path. Use TLS in transit, encryption at rest where needed, managed secrets, bounded inputs, and audit trails for sensitive actions. Signed object URLs should be short-lived and scoped; deletion and retention policies include derived copies and backups."], ["Recover deliberately", "Replicas help availability but backups support restoration. Define RPO (acceptable lost data) and RTO (acceptable restoration time), test restores, and describe zone or region failure behavior. Roll out gradually with health checks and rollback. Backward-compatible schema changes let old and new code coexist during deployment."]], "example": "A chat service can look healthy by HTTP success rate while messages sit in a queue. Monitor oldest undelivered message age and end-to-end delivery latency, then alert on a sustained delay that violates the product target.", "tradeoff": "More telemetry helps investigation but costs storage and can expose personal data. Sample where appropriate while retaining reliable aggregate measurements and essential audit records.", "prompt": "For file sharing, identify one authorization bug, two SLIs, and a recovery plan with RPO and RTO assumptions.", "answer": "An unguarded file-ID lookup can expose another user’s file. Measure authorized download success and upload completion latency. Assume RPO 15 minutes and RTO 1 hour for metadata, and design backups/recovery to meet them. Test a restore and validate ACLs before serving restored data.", "quiz": [{"q": "Replication alone protects you from accidental deletion.", "opts": ["True", "False; the deletion may replicate too"], "a": 1, "why": "Backups and tested restores address a different failure class."}, {"q": "Authorization answers…", "opts": ["Who are you?", "Are you permitted to access this object?", "How fast is the request?"], "a": 1, "why": "Authentication establishes identity; authorization checks permission."}], "lab": null, "id": "legacy-9", "legacyIndex": 9, "plain": "Design includes noticing user problems, controlling access, and recovering the service. Working once is only the beginning.", "analogy": "A shop needs alarms, keys, opening procedures, and a plan for a power outage.", "steps": ["Measure user-facing success and delay.", "Check permissions at every important boundary.", "Set recovery targets and test the procedure."], "terms": [["SLI", "A measured indicator of service behavior."], ["SLO", "A target for an indicator over a stated window."], ["Error budget", "The allowed unsuccessful behavior under a reliability objective."]], "stage": 4}, {"id": "recovery", "title": "Backups and disaster recovery", "goal": "Plan how to restore a working service and verify its data.", "plain": "A backup is a recoverable saved copy. A recovery plan explains how you will bring the service back and how much loss and delay are acceptable.", "analogy": "Photocopying a ledger gives you a fallback. To use it after a fire, you still need a safe place, a procedure, and a way to check what is missing.", "steps": ["Define acceptable data loss and restoration time.", "Keep recoverable copies protected from the same failure.", "Practice restoring and checking them."], "sections": [["Replicas are not enough", "An accidental delete or corrupt update can reach every active replica. Recovery may need a point-in-time copy and change records. A successful backup job does not prove the restore procedure works."], ["Two recovery questions", "RPO is the tolerated amount of lost data expressed in time. RTO is the tolerated time to restore service. For example, RPO 15 minutes allows up to that much data loss under the intended recovery plan; RTO one hour is a restoration target. Choose these with the product’s actual needs."], ["Test the whole path", "Restore to an isolated environment, verify important record counts and invariants, check permissions, and measure elapsed time. Document who performs the steps and how to resume writes safely. A restored database is only one part of a functioning product."]], "example": "For the shop, restore a backup, replay applicable changes, reconcile payment outcomes, check stock and ownership, and only then reopen the affected purchase path.", "tradeoff": "Shorter recovery targets generally require more frequent protection, faster restoration capacity, and more operating effort.", "prompt": "Write a recovery checklist with five steps and proposed RPO/RTO values for the bookshop.", "answer": "Example: identify scope; stop unsafe writes; restore an isolated copy; validate orders, inventory, and permissions; switch traffic after verification. Propose RPO 15 minutes and RTO one hour, then measure whether your procedure meets them.", "terms": [["Backup", "A saved copy intended for recovery."], ["RPO", "Target maximum data loss in time."], ["RTO", "Target maximum restoration duration."]], "quiz": [{"q": "A completed backup job proves recovery will succeed.", "opts": ["True", "False; a restore must be tested"], "a": 1, "why": "Files can exist while procedures, permissions, or data are unusable."}, {"q": "A replicated accidental delete needs…", "opts": ["A recovery source unaffected by the delete", "Only another copy of the same deleted state", "Only a new frontend"], "a": 0, "why": "Recoverability differs from active replication."}], "minutes": 20, "lab": null, "stage": 4, "group": "05 · Operate reliably"}, {"id": "deploy", "title": "Deploy changes without breaking users", "goal": "Plan compatibility, rollout, and rollback.", "plain": "Deployment puts a change into the environment users depend on. Safe deployment exposes it gradually and keeps old and new versions compatible during the transition.", "analogy": "Renovate one checkout counter at a time while the others keep serving. Keep the old payment process available until the new one is verified.", "steps": ["Make the change compatible with the current system.", "Release to a small portion and observe user outcomes.", "Expand or roll back using explicit criteria."], "sections": [["Code and data move at different times", "During a rollout, old and new application versions may coexist. If the new code deletes a field the old code still needs, older instances can fail. An expand-and-contract migration adds compatible structure first, moves usage, then removes obsolete structure later."], ["Canary and readiness", "A canary release serves a limited fraction before broader rollout. Compare errors, latency, and domain outcomes. A new process should become ready only after it can serve safely, including necessary connections and configuration."], ["Rollback is a plan", "Reverting code may not undo data changes or external actions. Write a forward-repair or compensation plan when necessary. Keep feature exposure separate from code deployment where useful, and define who can stop a rollout."]], "example": "Add a new optional order field first. Deploy code that tolerates both shapes. Populate it safely, switch reads, and remove the old field only after no old version requires it.", "tradeoff": "Compatibility work takes time, but it avoids needing all machines and clients to change at once.", "prompt": "A new app version renames a database column. Explain a safer rollout than changing the column immediately.", "answer": "Add the new field while retaining the old one. Make code tolerate both, migrate data and usages, validate, then retire the old field after all consumers move. Handle concurrent updates explicitly.", "terms": [["Deployment", "Put a change into a running environment."], ["Canary", "Expose a change to a limited portion before expanding it."], ["Rollback", "Return to a prior compatible state or version."]], "quiz": [{"q": "Why can old and new versions coexist?", "opts": ["Rollouts update instances over time", "Every request upgrades all servers", "Databases never change"], "a": 0, "why": "Compatibility must hold during the transition."}, {"q": "Rolling back code always reverses a payment already sent.", "opts": ["True", "False; external side effects need explicit recovery"], "a": 1, "why": "Deployment reversal and business compensation are different."}], "minutes": 20, "lab": null, "stage": 4, "group": "05 · Operate reliably"}, {"id": "cost", "title": "Capacity, cost, and sustainable operations", "goal": "Compare the cost of meeting the same requirement.", "plain": "A good design meets its requirements with a cost the product can s
